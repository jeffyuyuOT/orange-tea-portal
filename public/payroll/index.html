<style>
:root{
  /* light (default) palette — cool ink-slate ground, deep indigo accent, amber/emerald status */
  --bg:#f3f4f8; --bg-alt:#eceef4; --panel:#ffffff; --border:#dfe1ea; --border-strong:#c7cadb;
  --text:#1a1c2b; --muted:#666b82; --muted-2:#8a8fa3;
  --accent:#4338ca; --accent-dark:#332aa3; --accent-bg:#ecebfb; --accent-ink:#312a8f;
  --danger:#c0392b; --danger-bg:#fbeae7;
  --ok:#15803d; --ok-bg:#e7f6ec; --warn:#a15c07; --warn-bg:#fdf1de;
  --radius:9px; --shadow:0 4px 16px rgba(26,28,43,.08);
  --font-display:"IBM Plex Sans", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14151d; --bg-alt:#191a24; --panel:#1c1e2a; --border:#32343f; --border-strong:#454858;
    --text:#e8e9f2; --muted:#9599ad; --muted-2:#767a8e;
    --accent:#8b85f5; --accent-dark:#a49efa; --accent-bg:#26264a; --accent-ink:#c9c5fb;
    --danger:#e5766a; --danger-bg:#3a2220;
    --ok:#4ade80; --ok-bg:#123322; --warn:#f0b155; --warn-bg:#3a2b0f;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14151d; --bg-alt:#191a24; --panel:#1c1e2a; --border:#32343f; --border-strong:#454858;
  --text:#e8e9f2; --muted:#9599ad; --muted-2:#767a8e;
  --accent:#8b85f5; --accent-dark:#a49efa; --accent-bg:#26264a; --accent-ink:#c9c5fb;
  --danger:#e5766a; --danger-bg:#3a2220;
  --ok:#4ade80; --ok-bg:#123322; --warn:#f0b155; --warn-bg:#3a2b0f;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html{color-scheme:light dark;}
body{margin:0;font-family:var(--font-display);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:var(--font-display);font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;border:1px solid var(--border-strong);background:var(--panel);padding:6px 12px;color:var(--text);transition:background .12s,border-color .12s;}
button:hover{background:var(--bg-alt);}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
button.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-bg);}
button.danger:hover{filter:brightness(0.96);}
button.ghost{border-color:transparent;background:transparent;}
button:disabled{opacity:.4;cursor:not-allowed;}
input,select,textarea{font-family:var(--font-mono);font-size:13px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;color:var(--text);background:var(--panel);}
select{font-family:var(--font-display);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent);}
h1,h2,h3,h4{margin:0 0 8px;font-weight:600;text-wrap:balance;letter-spacing:-.01em;}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}
th,td{border:1px solid var(--border);padding:5px 7px;text-align:left;white-space:nowrap;font-family:var(--font-mono);}
th{background:var(--bg-alt);font-weight:600;position:sticky;top:0;font-family:var(--font-display);letter-spacing:.01em;}
.app-shell{display:flex;flex-direction:column;height:100vh;}
.topbar{background:#15131f;color:#fff;padding:0 16px;display:flex;align-items:center;gap:4px;flex-shrink:0;border-bottom:1px solid #2a2740;}
.topbar .brand{font-weight:700;padding:12px 14px 12px 0;margin-right:8px;font-size:15px;letter-spacing:-.01em;color:#fff;}
.toptab{padding:14px 16px;cursor:pointer;color:#b7b6cf;border-bottom:3px solid transparent;font-size:13.5px;font-weight:500;}
.toptab:hover{color:#fff;}
.toptab.active{color:#fff;border-bottom-color:var(--accent-dark);}
.main{flex:1;overflow:auto;padding:18px 22px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;font-family:var(--font-display);}
.pill.draft{background:var(--warn-bg);color:var(--warn);}
.pill.completed{background:var(--ok-bg);color:var(--ok);}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.subtab{padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:500;}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.field label{font-size:12px;color:var(--muted);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,10,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:100;}
.modal{background:var(--panel);border-radius:12px;padding:20px 22px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal.wide{max-width:960px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.close-x{cursor:pointer;font-size:18px;color:var(--muted);border:none;background:none;padding:2px 6px;}
.storeTabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
.storeTab{padding:6px 13px;border:1px solid var(--border);border-radius:6px 6px 0 0;background:var(--bg-alt);cursor:pointer;font-size:12.5px;font-weight:500;}
.storeTab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.editcell input{width:64px;padding:3px 5px;font-size:12px;}
.toolbar{display:flex;gap:8px;margin:10px 0;}
.table-wrap{overflow:auto;max-height:60vh;border:1px solid var(--border);border-radius:6px;}
.split-tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--accent-bg);color:var(--accent-ink);margin-left:4px;font-family:var(--font-display);}
.split-tag.bday{background:var(--ok-bg);color:var(--ok);}
.split-tag.warn{background:var(--warn-bg);color:var(--warn);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.link{color:var(--accent);cursor:pointer;text-decoration:underline;}
.total-row td{font-weight:700;background:var(--bg-alt);}
.helpbox{background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--accent-ink);margin-bottom:12px;font-family:var(--font-display);}
.emptystate{padding:40px;text-align:center;color:var(--muted);}
.iconbtn{border:none;background:none;color:var(--muted);cursor:pointer;padding:2px 5px;font-size:13px;}
.iconbtn:hover{color:var(--text);}
.filelink{font-size:12px;}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;font-family:var(--font-display);}
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand">💵 薪水計算系統</div>
    <div class="toptab" data-tab="t1">薪水計算表</div>
    <div class="toptab" data-tab="t2">歷史紀錄</div>
    <div class="toptab" data-tab="t3">資料管理</div>
  </div>
  <div class="main" id="main"></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* =========================================================================
   PART 0: Constants & seed data
   ========================================================================= */
const DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const PAYMENT_TYPES = ["FT","PT","Casual","CA","Direct"];
const PAYMENT_TYPE_LABEL = {FT:"FT (Full time)",PT:"PT (Part time)",Casual:"Casual",CA:"CA",Direct:"Direct"};
const DEFAULT_HOUR_CAP = 76; // 可報時數上限，未設定時的預設值 (hrs per calc period)

// Roles that aren't "real" scheduled staff for payroll purposes — mirrors
// src/lib/permissions.js's NON_PICKABLE_STAFF_ROLES. This static file (not
// part of the Vite build) can't import from the source tree, so the list
// is duplicated here; keep it in sync if that one ever changes. Used by
// fetchRealStaffForStore() below to skip training/QR-code/developer/
// accountant accounts when pulling Staff Information into Payroll.
const NON_PAYROLL_STAFF_ROLES = ["training", "qr_code_maker", "developer", "accountant"];

// --- QLD school term calendar, for the "school student" automatic hour cap ---
// Queensland state-school term dates (first/last day students attend),
// sourced from Education Queensland's published school calendar. Only the
// years actually looked up are listed here; add a year's four {start,end}
// ranges here (ISO dates, inclusive) when it's needed and the department
// has published it. A date whose year isn't listed is treated as "unknown"
// by qldSchoolDayStatus below, and schoolStudentHourCap falls back
// conservatively (the lower, term-time cap) in that case.
const QLD_SCHOOL_TERMS = {
  2026: [
    {start:"2026-01-27", end:"2026-04-02"},
    {start:"2026-04-20", end:"2026-06-26"},
    {start:"2026-07-13", end:"2026-09-18"},
    {start:"2026-10-06", end:"2026-12-11"},
  ],
  2027: [
    {start:"2027-01-27", end:"2027-03-25"},
    {start:"2027-04-12", end:"2027-06-25"},
    {start:"2027-07-12", end:"2027-09-17"},
    {start:"2027-10-05", end:"2027-12-10"},
  ],
};
// "term" = a weekday inside one of that year's four terms above (school is
// in session); "holiday" = a weekend, or a weekday outside every term
// (school holidays); "unknown" = the year isn't in QLD_SCHOOL_TERMS at all.
function qldSchoolDayStatus(iso){
  const year = Number(iso.slice(0,4));
  const dow = new Date(iso+"T00:00:00").getDay(); // 0=Sun..6=Sat
  if(dow===0 || dow===6) return "holiday";
  const terms = QLD_SCHOOL_TERMS[year];
  if(!terms) return "unknown";
  return terms.some(t=> iso>=t.start && iso<=t.end) ? "term" : "holiday";
}
// Source: Queensland's Child Employment Regulation 2016, s9 -- a
// school-aged employee (under 18, still a full-time secondary school
// student) may not work more than 12 hours in a calendar week (Mon-Sun) in
// which they're required to attend school on any day, or more than 38
// hours in a week they're not required to attend at all (i.e. the whole
// week sits inside school holidays). This is a WEEKLY limit, not a
// fortnightly one -- a two-week calc period is the SUM of whichever cap
// applies to each of the (normally two) calendar weeks it covers, so a
// fortnight straddling the end of term (one school week + one holiday
// week) legally gets 12+38=50hr, not a single flat number for the whole
// period. (A doubled "24hr/76hr per fortnight" shorthand only holds when
// BOTH weeks of the fortnight are the same kind -- it breaks for a mixed
// fortnight like this, which is exactly the case that surfaced this.)
const SCHOOL_STUDENT_WEEK_CAP_TERM = 12;    // hrs / calendar week containing any school day
const SCHOOL_STUDENT_WEEK_CAP_HOLIDAY = 38; // hrs / calendar week entirely inside school holidays
// Monday (ISO date) of the calendar week containing iso.
function qldWeekStartIso(iso){ return addDays(iso, -weekdayIndex(iso)); }
// Decides the total hour cap for a row covering [fromIso,toIso] (the row's
// own date range -- for a birthday-split row this is only that half of the
// calc period, same as how the ordinary hourCap already applies per-row
// rather than being pro-rated) by summing the correct weekly cap for EACH
// calendar week (Mon-Sun) the range touches -- see the comment above for
// why this can't just be one blanket number. A week is "term" if any of
// its 7 days falls inside a known school term; otherwise "holiday". A week
// touching a year with no calendar on file can't be classified, so it
// defaults to the stricter term-week cap (unknownYear:true flags this so
// the UI can tell the operator to double-check manually). `basis` summarizes
// the whole range as "term" (every week was a school week), "holiday"
// (every week was entirely holiday), or "mixed" (both kinds occurred).
function schoolStudentHourCap(fromIso, toIso){
  const weekStarts = new Set();
  for(const iso of dateRangeArray(fromIso, toIso)) weekStarts.add(qldWeekStartIso(iso));
  let cap=0, termWeeks=0, holidayWeeks=0, unknownYear=false;
  for(const wStart of weekStarts){
    let anyTerm=false, anyUnknown=false;
    for(const iso of dateRangeArray(wStart, addDays(wStart,6))){
      const status = qldSchoolDayStatus(iso);
      if(status==="term") anyTerm=true;
      else if(status==="unknown") anyUnknown=true;
    }
    if(anyTerm){ cap += SCHOOL_STUDENT_WEEK_CAP_TERM; termWeeks++; }
    else if(anyUnknown){ cap += SCHOOL_STUDENT_WEEK_CAP_TERM; termWeeks++; unknownYear=true; }
    else { cap += SCHOOL_STUDENT_WEEK_CAP_HOLIDAY; holidayWeeks++; }
  }
  const basis = (termWeeks>0 && holidayWeeks>0) ? "mixed" : (termWeeks>0 ? "term" : "holiday");
  return {cap, basis, unknownYear};
}

// Default award: Fast Food Industry Award MA000003 (best-effort figures, effective 1 Jul 2025).
// Sources cited to the user; editable in-app under 系統設置.
const DEFAULT_AWARD_LEVELS = [
  {id:"L1", name:"Level 1 (Grade 1)", baseRate:27.81},
  {id:"L2", name:"Level 2 (Grade 2)", baseRate:29.45},
  {id:"L3S", name:"Level 3 (Solo)", baseRate:29.91},
  {id:"L3R", name:"Level 3 (Responsible)", baseRate:30.27},
];
const DEFAULT_JUNIOR_PCT = [ // age -> % of adult rate
  {maxAge:15, pct:0.40},
  {maxAge:16, pct:0.50},
  {maxAge:17, pct:0.60},
  {maxAge:18, pct:0.70},
  {maxAge:19, pct:0.80},
  {maxAge:20, pct:0.90},
  {maxAge:999, pct:1.0},
];
// One shared set of Saturday/Sunday/Public holiday multipliers, applied to the
// FT/PT base rate -- Casual never gets its own independently-configured
// weekend/PH multiplier. Casual's rate for every bucket (including weekday) is
// the FT/PT rate for that same bucket PLUS a flat casual-loading amount
// (base rate x casualLoading), matching how casual loading is actually applied
// under the Award (a flat loading on the ordinary/base rate, not compounded
// on top of the penalty rate) -- see computeAwardRates.
const DEFAULT_PENALTY = {saturday:1.25, sunday:1.5, publicHoliday:2.25, casualLoading:0.25};
// Official Queensland statewide public holidays (source: qld.gov.au/recreation/
// travel/holidays/public, checked live). Where a date falls on a weekend, QLD
// gazettes an EXTRA weekday public holiday (e.g. 2026's Boxing Day falls on
// Saturday 26 Dec, so Monday 28 Dec is ALSO a public holiday) -- both dates
// are included here as separate entries, matching the official list exactly.
// Christmas Eve is deliberately NOT included here: QLD only treats it as a
// public holiday from 6pm-midnight (a part-day), not a full day, so it isn't
// a simple date to add to this list. It IS still handled -- automatically,
// every year, for every store -- by splitChristmasEveShift/isQldChristmasEve
// (see PART 5 below), which splits any shift crossing 6pm on 24 December
// into an ordinary-rate portion before 6pm and a public-holiday-rate portion
// from 6pm onward. No manual entry is needed or used for this date.
const QLD_PUBLIC_HOLIDAYS = {
  2026: [
    {date:"2026-01-01", name:"New Year's Day"},
    {date:"2026-01-26", name:"Australia Day"},
    {date:"2026-04-03", name:"Good Friday"},
    {date:"2026-04-04", name:"Day after Good Friday"},
    {date:"2026-04-05", name:"Easter Sunday"},
    {date:"2026-04-06", name:"Easter Monday"},
    {date:"2026-04-25", name:"Anzac Day"},
    {date:"2026-05-04", name:"Labour Day"},
    {date:"2026-10-05", name:"King's Birthday"},
    {date:"2026-12-25", name:"Christmas Day"},
    {date:"2026-12-26", name:"Boxing Day"},
    {date:"2026-12-28", name:"Boxing Day (additional)"},
  ],
  2027: [
    {date:"2027-01-01", name:"New Year's Day"},
    {date:"2027-01-26", name:"Australia Day"},
    {date:"2027-03-26", name:"Good Friday"},
    {date:"2027-03-27", name:"Day after Good Friday"},
    {date:"2027-03-28", name:"Easter Sunday"},
    {date:"2027-03-29", name:"Easter Monday"},
    {date:"2027-04-26", name:"Anzac Day"},
    {date:"2027-05-03", name:"Labour Day"},
    {date:"2027-10-04", name:"King's Birthday"},
    {date:"2027-12-25", name:"Christmas Day"},
    {date:"2027-12-27", name:"Christmas Day (additional)"},
    {date:"2027-12-26", name:"Boxing Day"},
    {date:"2027-12-28", name:"Boxing Day (additional)"},
  ],
};
// Royal Queensland Show (the "Ekka") show holiday -- a REGIONAL holiday, not
// statewide. This is the Brisbane LGA date specifically (most other QLD
// regions get a different local show-day date instead -- see
// qld.gov.au/recreation/travel/holidays/show for the full by-region list,
// which is far too granular to bundle a one-click preset for every region).
const QLD_EKKA_BRISBANE = {
  2026: {date:"2026-08-12", name:"Royal Queensland Show (Ekka) - Brisbane"},
  2027: {date:"2027-08-11", name:"Royal Queensland Show (Ekka) - Brisbane"},
};
// Merges the selected years' QLD public holidays (+ optionally the Brisbane
// Ekka show day) into a store's publicHolidays list, skipping any date
// already present (so re-running this for a store that already has some
// holidays entered doesn't create duplicates). Returns how many were added.
function applyQldHolidaysToStore(store, years, includeEkka){
  store.publicHolidays = store.publicHolidays || [];
  const existingDates = new Set(store.publicHolidays.map(h=>h.date));
  let added = 0;
  years.forEach(y=>{
    const list = (QLD_PUBLIC_HOLIDAYS[y]||[]).slice();
    if(includeEkka && QLD_EKKA_BRISBANE[y]) list.push(QLD_EKKA_BRISBANE[y]);
    list.forEach(h=>{
      if(existingDates.has(h.date)) return;
      store.publicHolidays.push({date:h.date, name:h.name});
      existingDates.add(h.date);
      added++;
    });
  });
  store.publicHolidays.sort((a,b)=>a.date<b.date?-1:1);
  return added;
}
// Fortnightly withholding approximation, built from FY2025-26 resident marginal tax brackets
// (annualised income /26, +2% Medicare levy, rounded to nearest dollar). Editable & should be
// verified against the ATO's official Schedule 1 / NAT 1006 fortnightly tax table before real use.
function annualBracketsWithThreshold(){
  return [
    {min:0, max:18200, base:0, rate:0},
    {min:18200, max:45000, base:0, rate:0.16},
    {min:45000, max:135000, base:4288, rate:0.30},
    {min:135000, max:190000, base:31288, rate:0.37},
    {min:190000, max:Infinity, base:51638, rate:0.45},
  ];
}
function annualBracketsNoThreshold(){
  return [
    {min:0, max:45000, base:0, rate:0.16},
    {min:45000, max:135000, base:7200, rate:0.30},
    {min:135000, max:190000, base:34200, rate:0.37},
    {min:190000, max:Infinity, base:54550, rate:0.45},
  ];
}
function defaultSettings(){
  return {
    key:"app",
    award:"Fast Food Industry Award (MA000003)",
    weekendSplit:false,
    awardLevels: JSON.parse(JSON.stringify(DEFAULT_AWARD_LEVELS)),
    juniorPct: JSON.parse(JSON.stringify(DEFAULT_JUNIOR_PCT)),
    penalty: JSON.parse(JSON.stringify(DEFAULT_PENALTY)),
    taxBrackets:{ withThreshold: annualBracketsWithThreshold(), noThreshold: annualBracketsNoThreshold(), medicareLevy:0.02 },
    autoBackup:false,
    // Off by default -- see the long comment on the "同步 OT Portal Staff
    // 資料" checkbox in renderSysSettings() for why. When off,
    // syncEmployeesFromStaffInfo() only ever adds/updates linked employees,
    // never resigns one just because it's missing from Staff Information's
    // current (still-incomplete) data.
    syncStaffInfoFully:false,
    // Jeff, 2026-09-30: 系統設置 > 匯入班表來源 -- which OT Portal data
    // source Tab 1's "從 OT Portal 匯入" button pulls from: "roster" (Roster
    // Hub's saved roster_periods/roster_entries) or "attendance" (actual
    // clock in/out punches, attendance_events -- already reflects any
    // manager/admin correction, since edits are applied in place there, see
    // importFromOTPortal() below). No default selected until Jeff picks one
    // and hits 確認 -- the import button refuses to run with this unset
    // rather than silently guessing which source he meant.
    otImportSource: null,
  };
}

/* =========================================================================
   PART 1: storage layer -- Supabase (cross-device sync), plus a tiny
   local-only IndexedDB kept solely for the File System Access API "backup
   folder" handle (see the "Backup folder" section in PART 9): that handle
   is a live browser object, not JSON, so it can never be stored in a
   database row, and it only ever makes sense on the one device/browser it
   was granted permission on -- so it stays local while everything else
   below now syncs across devices via Supabase.

   Access to every payroll_* table is restricted at the database level
   (RLS, see migration 0057_developer_role_and_payroll.sql) to accounts
   with role='developer' -- so even though this page has no login screen
   of its own, a non-developer account simply gets empty results / a
   permission error from every call below. This same-origin page shares
   the OT Portal's Supabase URL, so a fresh client here automatically
   picks up the session the portal already signed in (same localStorage
   key) -- no token has to be passed from the portal into this page.
   ========================================================================= */
const SUPABASE_URL = "https://rwstojuipeaaqdehqoqw.supabase.co";

const SUPABASE_TABLES = {

// --- local-only IndexedDB: "meta" store only (the backup-folder handle) ---
const DB_NAME = "PayrollDB_v1";
const DB_VERSION = 3; // v2's stores/employees/calcSheets/settings/supportLedger
                       // object stores are simply no longer touched by this
                       // app (that data now lives in Supabase, see above) --
                       // only "meta" is still created/used, for the
                       // local-only backup-folder handle below.
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta",{keyPath:"key"});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbPromise;
}
async function localMetaGet(key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("meta","readonly");
    const req = tx.objectStore("meta").get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function localMetaPut(val){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("meta","readwrite");
    tx.objectStore("meta").put(val);
    tx.oncomplete = ()=>resolve(val);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function localMetaDelete(key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("meta","readwrite");
    tx.objectStore("meta").delete(key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function localMetaClear(){
  const db = await openDB();

    const tx = db.transaction("meta","readwrite");

    tx.onerror = ()=>reject(tx.error);
  });

// (idbAll/idbGet/idbPut/idbDelete/idbClearAll), so every other PART of
// this file that calls them didn't need to change at all. ---
async function idbAll(storeName){
  if(storeName==="meta") throw new Error('idbAll("meta"): meta is local-only; use idbGet with a specific key.');
  const {table} = SUPABASE_TABLES[storeName];
  const {data, error} = await sb.from(table).select("data").order("created_at",{ascending:true});
  if(error) throw error;
  return (data||[]).map(r=>r.data);
}
async function idbGet(storeName,key){
  if(storeName==="meta") return localMetaGet(key);
  const {table} = SUPABASE_TABLES[storeName];
  const {data, error} = await sb.from(table).select("data").eq("row_key", String(key)).maybeSingle();
  if(error) throw error;
  return data ? data.data : undefined;
}
async function idbPut(storeName,val){
  if(storeName==="meta") return localMetaPut(val);
  const {table, key} = SUPABASE_TABLES[storeName];
  const {error} = await sb.from(table).upsert({row_key:String(val[key]), data:val, updated_at:new Date().toISOString()});
  if(error) throw error;
  return val;
}
async function idbDelete(storeName,key){
  if(storeName==="meta") return localMetaDelete(key);
  const {table} = SUPABASE_TABLES[storeName];
  const {error} = await sb.from(table).delete().eq("row_key", String(key));
  if(error) throw error;

async function idbClearAll(){
  for(const {table} of Object.values(SUPABASE_TABLES)){
    const {error} = await sb.from(table).delete().gt("row_key","");

  }

  // was a single object store cleared in full, backup-folder handle
  // included -- restoring a backup re-picks the folder if one's wanted.
  await localMetaClear();

  if(!dobIso) return null;
  const dob = fromISO(dobIso);

  for(let y=fromY; y<=toY; y++){

    if(dob.getMonth()===1 && dob.getDate()===29){ // Feb 29 handling
      const isLeap = (y%4===0 && (y%100!==0||y%400===0));

/* =========================================================================
   PART 3: minimal ZIP (read + write) and XLSX read/write, no external deps.
   Reader supports STORED(0) and DEFLATE(8, via DecompressionStream) entries.
   Writer only emits STORED entries (always valid, needs no compression API).
   ========================================================================= */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++){ c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); }
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){ c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8); }
  return (c ^ 0xFFFFFFFF)>>>0;
}
async function readZip(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);

  let eocd=-1;
  for(let i=bytes.length-22; i>=Math.max(0,bytes.length-22-65557); i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("不是有效的 zip/xlsx 檔案");
  const entryCount = dv.getUint16(eocd+10,true);
  let cdOffset = dv.getUint32(eocd+16,true);
  const entries = {};
  for(let i=0;i<entryCount;i++){
    if(dv.getUint32(cdOffset,true)!==0x02014b50) break;
    const compMethod = dv.getUint16(cdOffset+10,true);
    const compSize = dv.getUint32(cdOffset+20,true);
    const uncompSize = dv.getUint32(cdOffset+24,true);
    const nameLen = dv.getUint16(cdOffset+28,true);
    const extraLen = dv.getUint16(cdOffset+30,true);
    const commentLen = dv.getUint16(cdOffset+32,true);
    const localOffset = dv.getUint32(cdOffset+42,true);
    const name = new TextDecoder().decode(bytes.subarray(cdOffset+46,cdOffset+46+nameLen));
    entries[name] = {compMethod, compSize, uncompSize, localOffset};
    cdOffset += 46+nameLen+extraLen+commentLen;
  }
  const files = {};
  for(const name in entries){
    const e = entries[name];
    const lfNameLen = dv.getUint16(e.localOffset+26,true);
    const lfExtraLen = dv.getUint16(e.localOffset+28,true);
    const dataStart = e.localOffset+30+lfNameLen+lfExtraLen;
    const compData = bytes.subarray(dataStart, dataStart+e.compSize);
    files[name] = async ()=>{
      if(e.compMethod===0) return compData;
      if(e.compMethod===8){
        const ds = new DecompressionStream("deflate-raw");
        const stream = new Blob([compData]).stream().pipeThrough(ds);
        const buf = await new Response(stream).arrayBuffer();
        return new Uint8Array(buf);
      }
      throw new Error("不支援的壓縮方式: "+e.compMethod);
    };
  }
  return files; // map name -> async () => Uint8Array
}
function zipLocalHeader(name, data, crc){
  const nameBytes = new TextEncoder().encode(name);
  const header = new Uint8Array(30+nameBytes.length);
  const dv = new DataView(header.buffer);
  dv.setUint32(0,0x04034b50,true);
  dv.setUint16(4,20,true); dv.setUint16(6,0,true); dv.setUint16(8,0,true);
  dv.setUint16(10,0,true); dv.setUint16(12,0,true);
  dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
  dv.setUint16(26,nameBytes.length,true); dv.setUint16(28,0,true);
  header.set(nameBytes,30);
  return header;
}
function buildZip(fileMap){ // {name: Uint8Array}
  const chunks=[]; const central=[]; let offset=0;
  for(const name in fileMap){
    const data = fileMap[name];
    const crc = crc32(data);
    const lh = zipLocalHeader(name,data,crc);
    chunks.push(lh,data);
    const nameBytes = new TextEncoder().encode(name);
    const ch = new Uint8Array(46+nameBytes.length);
    const dv = new DataView(ch.buffer);
    dv.setUint32(0,0x02014b50,true);
    dv.setUint16(4,20,true); dv.setUint16(6,20,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true); dv.setUint16(14,0,true);
    dv.setUint32(16,crc,true); dv.setUint32(20,data.length,true); dv.setUint32(24,data.length,true);
    dv.setUint16(28,nameBytes.length,true); dv.setUint16(30,0,true); dv.setUint16(32,0,true);
    dv.setUint16(34,0,true); dv.setUint16(36,0,true); dv.setUint32(38,0,true);
    dv.setUint32(42,offset,true);
    ch.set(nameBytes,46);
    central.push(ch);
    offset += lh.length+data.length;
  }
  const centralStart = offset;
  let centralSize=0;
  for(const c of central){ chunks.push(c); centralSize+=c.length; }
  const eocd = new Uint8Array(22);
  const dv = new DataView(eocd.buffer);
  dv.setUint32(0,0x06054b50,true);
  dv.setUint16(8,central.length,true); dv.setUint16(10,central.length,true);
  dv.setUint32(12,centralSize,true); dv.setUint32(16,centralStart,true);
  chunks.push(eocd);
  let total=0; for(const c of chunks) total+=c.length;
  const out = new Uint8Array(total); let p=0;
  for(const c of chunks){ out.set(c,p); p+=c.length; }
  return out;
}

// A cell in `rows` is normally just a raw value (number/string), which is
// how every pre-existing caller of sheetsToXlsx (roster templates, 總資料
// export, etc.) still writes them -- fully backward compatible, no visible
// change. A cell MAY instead be a styled cell object
// { v, border, bold, wrap, center, skipWidth, decimals2 } to get formatting
// on that cell -- `border` is { top, bottom, left, right }, each side either
// omitted (no line) or one of the OOXML border style names, e.g. "thin"
// (normal grid line) or "double" (used for 會計資料's column-group dividers
// -- see exportSheetToXlsx's accounting branch); `bold` renders the cell in
// a bold font (used for the accounting export's Total row); `wrap` turns on
// Excel's "wrap text" cell format; `center` centers the cell's content both
// horizontally and vertically (used for the accounting export's two-row
// merged header); `skipWidth` excludes this cell from column auto-width

// Chinese text (e.g. 備註/Note columns) or emoji (e.g. the 🎂/⚠️ birthday
// notes) and truncate them visually even though the string itself "fits".
function textDisplayWidth(s){
  let w = 0;
  for(const ch of String(s)){
    const cp = ch.codePointAt(0);
    const isWide = (cp>=0x1100 && cp<=0x115F) || (cp>=0x2E80 && cp<=0xA4CF) ||
      (cp>=0xAC00 && cp<=0xD7A3) || (cp>=0xF900 && cp<=0xFAFF) ||
      (cp>=0xFF00 && cp<=0xFF60) || (cp>=0xFFE0 && cp<=0xFFE6) ||

// Auto-fits each column to its widest cell (header included) across all rows
// of one sheet, so exported text is never clipped/wrapped the way a fixed
// default column width would clip it. Returns an Excel "width" (roughly
// character count) per column index, padded a little and clamped to a sane
// range so one huge outlier value can't blow a column out to an unusable size.
function columnWidthsForRows(rows){
  const widths = [];
  rows.forEach(row=>{
    row.forEach((rawCell,cIdx)=>{
      if(cellSkipWidth(rawCell)) return;
      const v = cellValue(rawCell);
      if(v===null||v===undefined||v==="") return;
      // A `decimals2` cell always DISPLAYS with two decimal places (see
      // sheetsToXlsx's "0.00" number format), so its rendered width should
      // be measured from that formatted text (e.g. "730.00"), not the raw
      // number's default toString() (e.g. "730") which would undercount it.
      const displayVal = (cellDecimals2(rawCell) && typeof v==="number" && isFinite(v)) ? v.toFixed(2) : v;
      // A cell's text may contain an embedded "\n" (used to force a
      // two-line header label on wrap-text columns, e.g. "Weekday\nrate")
      // -- since that text wraps onto its own lines in Excel, the column
      // only needs to be as wide as the LONGEST individual line, not the
      // whole unwrapped string, so this doesn't defeat the narrower width
      // wrap text is meant to enable.
      const lines = String(displayVal).split("\n");
      const w = Math.max(...lines.map(line=>textDisplayWidth(line)));
      if(!widths[cIdx] || w>widths[cIdx]) widths[cIdx] = w;

/* =========================================================================
   PART 4: roster parsing (paste / xlsx) -> {storeName, employees:[{name,dailyHours}]}
   ========================================================================= */
const WD_LABELS = ["mon","tue","wed","thu","fri","sat","sun"];
const MONTH_NAMES = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseTSV(text){
  return text.replace(/\r/g,"").split("\n").map(line=>line.split("\t"));

function cellStr(v){ return v==null?"":String(v).trim(); }
// Parses a date-ish cell (Excel serial number, "24-Aug", "Aug-24", "24/08/2026", "2026-08-24"...)
// into {year|null, month(0-11), day}. Returns null if unrecognised.
function parseDateCell(v){
  if(v==null || v==="") return null;
  if(typeof v === "number" && isFinite(v)){
    // Only treat as an Excel date serial if it's in a plausible date range
    // (~1954-2119). Small numbers (hour-of-day fractions, break-minute counts,
    // raw shift-time values from a "numbers" table, etc.) are NOT dates and
    // must not be misread as one, or a correct roster can get flagged as a
    // date mismatch.
    if(v<20000 || v>80000) return null;
    const ms = Date.UTC(1899,11,30) + Math.round(v)*86400000;
    const d = new Date(ms);
    return {year:d.getUTCFullYear(), month:d.getUTCMonth(), day:d.getUTCDate()};
  }
  const s = cellStr(v);
  let m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3,})[-\/ ]?(\d{2,4})?$/);
  if(m){
    const mi = MONTH_NAMES.indexOf(m[2].slice(0,3).toLowerCase());
    if(mi>=0) return {day:Number(m[1]), month:mi, year:m[3]?normalizeYear(m[3]):null};
  }
  m = s.match(/^([A-Za-z]{3,})[-\/ ](\d{1,2})(?:[-\/ ](\d{2,4}))?$/);
  if(m){
    const mi = MONTH_NAMES.indexOf(m[1].slice(0,3).toLowerCase());
    if(mi>=0) return {day:Number(m[2]), month:mi, year:m[3]?normalizeYear(m[3]):null};
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return {year:Number(m[1]), month:Number(m[2])-1, day:Number(m[3])};
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);

}
function normalizeYear(y){ y=Number(y); return y<100 ? 2000+y : y; }

// it) — when more than one Mon..Sun header row is found we use the LAST one,
// i.e. the lower table, since its time values are easiest to read reliably.
function findWeekdayRows(rows){
  const hits=[];
  for(let r=0;r<rows.length;r++){
    const row = rows[r]||[];
    let n=0;
    for(let c=0;c<row.length;c++){ if(WD_LABELS.includes(cellStr(row[c]).toLowerCase())) n++; }

function locateDateRow(rows, wdCandidates, wdRow, dayCols){
  const candidateIdx = new Set([wdRow-1, wdCandidates[0]-1]);
  let bestRow=null, bestScore=-1;
  candidateIdx.forEach(r=>{
    if(r<0) return;
    const row = rows[r]||[];
    let score=0;
    for(let k=0;k<dayCols.length;k++){ if(parseDateCell(row[dayCols[k]])!=null) score++; }
    if(score>bestScore){ bestScore=score; bestRow=row; }

}
function parseRosterGrid(rows, dateFrom, dateTo, warnings){
  warnings = warnings||[];
  let storeName = "";
  for(let i=0;i<Math.min(3,rows.length);i++){
    const c0 = cellStr(rows[i] && rows[i][0]);
    if(c0){ storeName = c0; break; }
  }
  const wdCandidates = findWeekdayRows(rows);
  if(!wdCandidates.length){ warnings.push("找不到 Mon/Tue/.../Sun 標題列，無法解析班表"); return {storeName, employees:[], warnings, dateIssues:[]}; }
  const wdRow = wdCandidates[wdCandidates.length-1]; // lower table if two are present
  const wRow = rows[wdRow]||[];
  const dayCols=[];
  for(let c=0;c<wRow.length;c++){
    if(WD_LABELS.includes(cellStr(wRow[c]).toLowerCase())) dayCols.push(c);
  }

  // Check the date-header row against the expected range. Usually this is the
  // row directly above the weekday row we're reading from, but when a sheet
  // has two stacked tables (raw numbers on top, human-readable time below —
  // see the header comment above) the date row is often shown only once,
  // above the TOP table, and not repeated above the bottom one. In that case
  // the row directly above the bottom weekday row is unrelated data (e.g. raw
  // numeric shift times), and any number there would otherwise be
  // misinterpreted as an Excel date serial and wrongly flagged as a mismatch.

  // calendar day as column 0 of the selected period, it's 7 days later. Using
  // the file's own date is also what lets us validate "is this date within my
  // selected period" (which is all that should matter for a partial-period
  // file) rather than "does this date exactly match this column's position".

        // raw serial number, which is meaningless to a person reading the modal.

      }

      // No parseable date for this column -- fall back to matching it
      // positionally against the selected period (best effort; can't validate).
      iso = dateList[k] || null;

    }
    colDates.push(iso);
  }
  if(unresolvedCols>0){
    warnings.push(`班表有 ${unresolvedCols} 個欄位無法判讀日期，已依欄位順序對應計算表區間；請確認結果是否正確。`);
  }

      const sCol = dayCols[k];

async function parseRosterFromFile(file, dateFrom, dateTo){
  const warnings=[];

  const sheets = await xlsxToSheets(buf);
  if(!sheets.length){ warnings.push(`[${file.name}] 活頁簿中找不到任何工作表`); return {stores:[], warnings}; }
  const stores = sheets.map(s=>{
    const res = parseRosterGrid(s.rows, dateFrom, dateTo, []);
    warnings.push(...res.warnings.map(w=>`[${file.name} / ${s.name}] ${w}`));
    if(!res.storeName) res.storeName = s.name;
    res.sourceLabel = `${file.name} / ${s.name}`;

async function parseRosterFromFiles(fileList, dateFrom, dateTo){
  const warnings=[]; const stores=[];
  for(const file of fileList){
    const res = await parseRosterFromFile(file, dateFrom, dateTo);
    warnings.push(...res.warnings);
    stores.push(...res.stores);
  }
  return {stores, warnings};
}
function parseRosterFromPaste(text, dateFrom, dateTo){
  const rows = parseTSV(text);

  const res = parseRosterGrid(rows, dateFrom, dateTo, warnings);
  res.sourceLabel = res.storeName||"貼上內容";
  return {stores:[res], warnings};

function classifyDay(iso, store, weekendSplit){
  const isPH = (store.publicHolidays||[]).some(h=>h.date===iso);
  if(isPH) return "publicHoliday";
  const wd = weekdayIndex(iso); // 0..6 Mon..Sun
  if(wd===5) return "saturday";
  if(wd===6) return weekendSplit ? "sunday" : "saturday"; // fold Sunday into Saturday rate when not split
  return "weekday";
}
// Same as classifyDay's weekday/Saturday/Sunday logic, but never returns
// "publicHoliday" -- used for the pre-6pm portion of 24 December (see
// splitChristmasEveShift below), which is ordinary/weekend-rate time, not PH
// time, regardless of whether the store's own publicHolidays list happens to
// have an (now superseded) manual entry for that date.
function classifyDayIgnoringPH(iso, weekendSplit){
  const wd = weekdayIndex(iso);
  if(wd===5) return "saturday";
  if(wd===6) return weekendSplit ? "sunday" : "saturday";

// full day. This is a standing rule (confirmed against legislation.qld.gov.au
// and qld.gov.au), not a per-year gazetted date, so it applies automatically
// every year and is NOT driven by the store's publicHolidays list the way
// every other holiday is.
const QLD_XMAS_EVE_CUTOVER_HOUR = 18; // 6:00pm

// pre-6pm portion (ordinary/weekend rate) and a post-6pm portion (public
// holiday rate), using the shift's raw start/end time if we have it.
//   raw: {start, end, brk} as captured at roster-parse time (see
//   parseRosterGrid), or undefined/null if this day's hours have no
//   associated start/end (e.g. a manually-typed total on an older sheet).
// The break duration recorded on the roster is a single number for the whole
// shift, not tied to a specific clock time, so by default it can't be
// attributed to either side of 6pm with certainty -- this allocates the
// shift's ALREADY break-adjusted total proportionally by each side's share
// of the shift's clock-time span, which is the best approximation available
// from the data on hand. WHEN a shift crosses 6pm and has a recorded break,
// the import flow (see detectXmasEveBreakCases/showXmasEveBreakModal) asks
// the user to confirm exactly how much of the break fell after 6pm instead

function splitChristmasEveShift(iso, totalWorkedHours, raw, weekendSplit){
  const beforeType = classifyDayIgnoringPH(iso, weekendSplit);
  if(!raw || raw.start==null || raw.end==null){
    // No shift-level start/end on file for this day -- can't tell how much
    // falls after 6pm, so keep the whole day at its ordinary rate rather than
    // guessing. A shift imported from a roster file (the normal case) always
    // has raw start/end and splits correctly.

  }

// NAT 1006): every result is rounded to the nearest whole dollar.
function fortnightlyAtoWithholding(fortnightlyEarnings, taxFreeThreshold){
  const e = Math.max(0, fortnightlyEarnings||0);
  if(e > 6800){
    if(taxFreeThreshold){
      if(e > 7305) return Math.round(2124 + 0.47*(e-7305));
      return Math.round(1926 + 0.39*(e-6800));
    }
    return Math.round(2210 + 0.47*(e-6800));
  }
  if(e < 2) return 0;
  const table = taxFreeThreshold ? FORTNIGHTLY_WT : FORTNIGHTLY_NT;
  const idx = Math.min(table.length-1, Math.floor(e/2)-1); // "nearest lower figure"
  return table[idx];
}
function computeTaxForPeriod(grossForPeriod, periodDays, taxFreeThreshold, settings){
  if(grossForPeriod<=0) return 0;
  // A true fortnightly (14-day) pay period is withheld EXACTLY per the
  // ATO's own published Fortnightly tax table (see fortnightlyAtoWithholding
  // above) instead of the annualised-bracket approximation below -- the
  // official table already has the Low Income Tax Offset and Medicare levy
  // baked into its rounding, which a simple annualise/de-annualise formula
  // can't reproduce exactly (this is what the user's own worked comparison
  // against NAT 1006 turned up). Any OTHER period length (e.g. a 7-day
  // weekly sheet) has no official table on file here, so it still falls
  // back to the editable annualised-bracket approximation in Settings.
  if(periodDays===14){
    return fortnightlyAtoWithholding(grossForPeriod, taxFreeThreshold);
  }
  const brackets = taxFreeThreshold ? settings.taxBrackets.withThreshold : settings.taxBrackets.noThreshold;
  const annualIncome = grossForPeriod/periodDays*365.25;
  let annualTax = bracketTax(annualIncome, brackets);
  annualTax += annualIncome * (settings.taxBrackets.medicareLevy||0);
  const periodTax = annualTax/365.25*periodDays;
  return Math.max(0, Math.round(periodTax));
}

const WORKING_HOLIDAY_TAX_RATE = 0.15; // flat "Working holiday maker" withholding rate (ATO Sch 15) applied to the whole bank amount -- no tax-free threshold, no brackets, no progressive table.
function computeTaxForRow(bankAmount, periodDays, taxType, settings){
  if(taxType==="workingHoliday"){
    return bankAmount>0 ? round2(bankAmount*WORKING_HOLIDAY_TAX_RATE) : 0;
  }
  return computeTaxForPeriod(bankAmount, periodDays, taxType!=="without", settings);
}
function emptyBuckets(){ return {weekday:0, saturday:0, sunday:0, publicHoliday:0}; }
function sumDailyIntoBuckets(dailyHours, store, weekendSplit, fromIso, toIso, dailyRaw){
  const buckets = emptyBuckets();
  for(const iso in dailyHours){
    if(iso<fromIso || iso>toIso) continue;
    if(isQldChristmasEve(iso)){
      const split = splitChristmasEveShift(iso, dailyHours[iso], dailyRaw && dailyRaw[iso], weekendSplit);
      buckets[split.beforeType] += split.beforeHrs;
      buckets.publicHoliday += split.afterHrs;
      continue;
    }
    const type = classifyDay(iso, store, weekendSplit);
    buckets[type] += dailyHours[iso];
  }
  return buckets;
}
function makeRatesObj(weekday,saturday,sunday,publicHoliday){ return {weekday,saturday,sunday,publicHoliday}; }
// Allocates worked hours to "award rate" vs "cash rate" against a per-period hour
// cap, with Public holiday hours protected first, then weekend (Sat/Sun), then
// weekday last — i.e. weekday hours are the first to spill over into cash rate.
function splitAwardCash(hoursFinal, capacity){
  const order = ["publicHoliday","saturday","sunday","weekday"];
  let remaining = Math.max(0, Number(capacity)||0);
  const award = emptyBuckets(), cash = emptyBuckets();
  order.forEach(k=>{
    // Clamp to 0 first: a 補時數 deduction (negative adj) can bring a bucket's
    // net hours below zero (e.g. more hours removed than were ever worked),
    // which should mean "nothing left to pay" for that bucket, not a negative
    // cash-hours figure.
    const h = Math.max(0, hoursFinal[k]||0);
    const a = Math.max(0, Math.min(h, remaining));
    award[k] = a;
    cash[k] = h - a;
    remaining -= a;
  });
  return {award, cash};
}
// Direct is a fundamentally different pay model from everything else: no
// per-bucket rate at all -- one flat cash rate applied only to hours that
// exceed a pooled hour limit. "hours" on a Direct row is already the SUM
// across every store the employee worked this period (pooled by
// applyDirectPools at import time), classified per-bucket using each
// store's own calendar; Public holiday hours get an extra multiplier
// (e.g. 1.5x) applied when totalling hours (not to a rate, since there is
// no separate PH rate for this type). Extra hr and Bonus hr are added on
// top, then only the portion above directHourLimit is ever paid, entirely
// in cash (bankAmount is always 0, so no tax is withheld -- same as CA).
function directRowTotal(row){
  const h = row.hours||emptyBuckets();
  const phMult = row.directPhMultiplier!=null && row.directPhMultiplier!=="" ? Number(row.directPhMultiplier) : 1;
  const pooledTotal = (h.weekday||0) + (h.saturday||0) + (h.sunday||0) + (h.publicHoliday||0)*phMult;
  const extraHr = Number(row.directExtraHr)||0;
  const bonusHr = Number(row.directBonusHr)||0;
  const adjustedTotal = pooledTotal + extraHr + bonusHr;
  const hourLimit = Number(row.directHourLimit)||0;
  const excessHrs = Math.max(0, adjustedTotal - hourLimit);
  const cashAmount = round2(excessHrs * (Number(row.directCashRate)||0));
  const bankAmount = 0;
  const total = round2(bankAmount + cashAmount);
  return {
    hoursFinal: h, awardHours: emptyBuckets(), cashHours: emptyBuckets(),
    bankAmount, cashAmount, total,
    directPooledTotal: round2(pooledTotal), directAdjustedTotal: round2(adjustedTotal), directExcessHrs: round2(excessHrs),
  };
}
function rowTotal(row){
  if(row.paymentType==="Direct") return directRowTotal(row);
  const b = row.hours, a = row.adj||emptyBuckets();
  const h = {
    weekday: b.weekday + (a.weekday||0),
    saturday: b.saturday + (a.saturday||0),
    sunday: b.sunday + (a.sunday||0),
    publicHoliday: b.publicHoliday + (a.publicHoliday||0),
  };
  let award, cash;
  if(row.noCapSplit){
    award = h; cash = emptyBuckets();
  } else {
    const split = splitAwardCash(h, row.hourCap!=null ? row.hourCap : DEFAULT_HOUR_CAP);
    award = split.award; cash = split.cash;
  }
  const cr = row.cashRates||emptyBuckets();
  let bankPay = 0, cashPay = 0;
  ["weekday","saturday","sunday","publicHoliday"].forEach(k=>{
    bankPay += award[k]*(row.rates[k]||0);
    cashPay += cash[k]*(cr[k]||0);
  });
  bankPay += Number(row.bonus)||0; // bonus is paid through payroll/bank, not cash-in-hand
  // "Bank amount" is the portion that actually goes through payroll (and is
  // what withheld tax is calculated on); "cash amount" is paid off-payroll.
  // A CA (payment type) employee is paid ENTIRELY in cash by definition, so
  // regardless of the award/cash hour-cap split above (which is moot for them
  // since noCapSplit means all their hours land in the "award" bucket
  // internally, there being no cap to split against), their whole total is
  // classified as cash amount here, with $0 bank amount and $0 withheld tax.
  let bankAmount, cashAmount;
  if(row.paymentType==="CA"){
    bankAmount = 0;
    cashAmount = round2(bankPay + cashPay);
  } else {
    bankAmount = round2(bankPay);
    cashAmount = round2(cashPay);
  }
  const total = round2(bankAmount + cashAmount);
  return {hoursFinal:h, awardHours:award, cashHours:cash, bankAmount, cashAmount, total};
}
function recalcRow(row, periodDays){
  const res = rowTotal(row);
  row.hoursFinal = res.hoursFinal;
  row.awardHours = res.awardHours;
  row.cashHours = res.cashHours;
  row.bankAmount = res.bankAmount;
  row.cashAmount = res.cashAmount;
  row.total = res.total;
  if(row.paymentType==="Direct"){
    row.directPooledTotal = res.directPooledTotal;
    row.directAdjustedTotal = res.directAdjustedTotal;
    row.directExcessHrs = res.directExcessHrs;
  }
  // Withheld tax is calculated on the bank (payroll) portion only -- cash-paid
  // amounts (including all of a CA employee's pay, and all of a Direct
  // employee's pay) never go through payroll withholding, so they're
  // excluded from the taxable base.
  row.tax = computeTaxForRow(row.bankAmount, periodDays, row.taxType, currentSettings);
  row.net = round2(row.total-row.tax);
  return row;
}
// Identifies "the same row" across two different builds of a store's rows
// (e.g. the sheet's existing rows vs a freshly (re-)imported roster's rows)
// for the sole purpose of carrying forward hand-entered adjustments -- keyed
// by employee id when there is one (stable across re-imports since it's the
// employee record's own id, not anything regenerated at row-build time),
// falling back to the display name for an unregistered row (no employee
// record to key off), and by splitLabel so a birthday-split "(Before BD)"/
// "(After BD)" pair is matched to its own counterpart rather than the other
// half of the split.
function rowCarryKey(row){
  const idPart = row.employeeId ? ("id:"+row.employeeId) : ("name:"+(row.baseName||row.name||"").trim().toLowerCase());
  return idPart + "::" + (row.splitLabel||"");
}
function buildRowsForStore(store, parsedEmp, empRecords, calcSheet, settings, oldRows){
  const rows = [];
  const periodDays = dateRangeArray(calcSheet.dateFrom, calcSheet.dateTo).length;
  const usedEmpIds = new Set();
  // Re-importing a roster only ever supplies weekday/weekend/public-holiday
  // HOURS -- it has no opinion on 補weekday/weekend/public holiday hr (row.adj)
  // or Bonus (row.bonus), both of which are hand-typed by the payroll
  // operator directly into this calc sheet, typically BEFORE the roster is
  // even imported (precisely so they aren't forgotten later). A fresh
  // makeRow() always initializes those to zero, so without this, importing
  // (or re-importing, e.g. a corrected roster file, or a second week's file)
  // would silently wipe out anything already recorded for an employee who's
  // still present in the new roster. Carry them forward from the matching
  // old row (see rowCarryKey) onto each freshly-built row below; an employee
  // genuinely new to this store this period simply has no old row to match,
  // so makeRow's zero defaults stand as before.
  const oldRowByKey = new Map();
  (oldRows||[]).forEach(r=>{ oldRowByKey.set(rowCarryKey(r), r); });
  function carryForwardAdjustments(newRow){
    const old = oldRowByKey.get(rowCarryKey(newRow));
    if(!old) return;
    newRow.adj = old.adj ? JSON.parse(JSON.stringify(old.adj)) : emptyBuckets();
    newRow.bonus = Number(old.bonus)||0;
  }
  for(const pe of parsedEmp.employees){
    const match = empRecords.find(e=>e.storeId===store.id && e.name.trim().toLowerCase()===pe.name.trim().toLowerCase());
    if(match) usedEmpIds.add(match.id);
    const bdayIso = match ? birthdayInRange(match.dob, calcSheet.dateFrom, calcSheet.dateTo) : null;
    // Only actually split the row in two if the birthday crosses into a
    // DIFFERENT pay rate (e.g. a junior-rate age bracket boundary). If the
    // rate before and after is identical -- e.g. turning 15 while the junior
    // table's bracket only changes at 17, or any manual/CA rate (never
    // age-dependent to begin with) -- a split just produces two rows with the
    // same rate for no reason, so we fall through to the single-row path
    // using the age as of period end (same convention as an employee with no
    // birthday in the period at all).
    const ratesChangeAtBday = match && bdayIso &&
      !ratesEqual(computeRowRates(match, calcAge(match.dob, addDays(bdayIso,-1)), settings),
                  computeRowRates(match, calcAge(match.dob, bdayIso), settings));
    if(ratesChangeAtBday){
      const beforeTo = addDays(bdayIso,-1);
      const ageBefore = calcAge(match.dob, beforeTo);
      const ageAfter = calcAge(match.dob, bdayIso);
      const beforeDaily = {}, afterDaily = {}, beforeRaw = {}, afterRaw = {};
      for(const iso in pe.dailyHours){
        if(iso<bdayIso){ beforeDaily[iso]=pe.dailyHours[iso]; if(pe.dailyRaw && pe.dailyRaw[iso]) beforeRaw[iso]=pe.dailyRaw[iso]; }
        else { afterDaily[iso]=pe.dailyHours[iso]; if(pe.dailyRaw && pe.dailyRaw[iso]) afterRaw[iso]=pe.dailyRaw[iso]; }
      }
      const bBuckets = sumDailyIntoBuckets(beforeDaily, store, settings.weekendSplit, calcSheet.dateFrom, calcSheet.dateTo, beforeRaw);
      const aBuckets = sumDailyIntoBuckets(afterDaily, store, settings.weekendSplit, calcSheet.dateFrom, calcSheet.dateTo, afterRaw);
      const rBefore = makeRow(match, pe.name, ageBefore, bBuckets, settings, "(Before BD)", calcSheet.dateFrom, beforeTo);
      const rAfter = makeRow(match, pe.name, ageAfter, aBuckets, settings, "(After BD)", bdayIso, calcSheet.dateTo);
      rBefore.birthdayInPeriod = rAfter.birthdayInPeriod = true;
      carryForwardAdjustments(rBefore);
      carryForwardAdjustments(rAfter);
      rows.push(rBefore, rAfter);
    } else {
      const buckets = sumDailyIntoBuckets(pe.dailyHours, store, settings.weekendSplit, calcSheet.dateFrom, calcSheet.dateTo, pe.dailyRaw);
      const age = match ? calcAge(match.dob, calcSheet.dateTo) : null;
      const row = makeRow(match, pe.name, age, buckets, settings, "", calcSheet.dateFrom, calcSheet.dateTo);
      // Still flag that a birthday fell inside the period even though it
      // didn't change the rate (and so didn't warrant a row split) -- a
      // fixed/manual-rate employee's birthday is still worth a nudge to
      // review their rate by hand, since the system never auto-adjusts it
      // regardless of whether THIS particular birthday happened to change
      // anything for an award-rate employee.
      if(match && bdayIso) row.birthdayInPeriod = true;
      carryForwardAdjustments(row);
      rows.push(row);
    }
  }
  rows.forEach(r=>recalcRow(r, periodDays));
  return rows;
}
// Resolves just the "rates" bucket (weekday/saturday/sunday/publicHoliday) a
// row would use for a given age -- factored out of makeRow so buildRowsForStore
// can compare the before-birthday vs after-birthday rate WITHOUT building a
// full row, to decide whether a birthday split is actually needed (see
// buildRowsForStore below).
function computeRowRates(match, age, settings){
  if(!match) return emptyBuckets();
  if(match.paymentType==="CA") return makeRatesObj(match.rates.weekday, match.rates.saturday, match.rates.sunday, match.rates.publicHoliday);
  if(match.rateMode==="manual") return makeRatesObj(match.rates.weekday, match.rates.saturday, match.rates.sunday, match.rates.publicHoliday);
  const r = computeAwardRates(settings, match.level, match.paymentType, age);
  return makeRatesObj(r.weekday, r.saturday, r.sunday, r.publicHoliday);
}
function ratesEqual(a, b){
  return a.weekday===b.weekday && a.saturday===b.saturday && a.sunday===b.sunday && a.publicHoliday===b.publicHoliday;
}
function makeRow(match, displayName, age, buckets, settings, splitLabel, periodFrom, periodTo){
  let rates, cashRates, hourCap, noCapSplit, schoolCapBasis=null, schoolCapUnknownYear=false;
  if(!match){
    rates = emptyBuckets(); cashRates = emptyBuckets(); hourCap = null; noCapSplit = true;
  } else if(match.paymentType==="CA"){
    rates = computeRowRates(match, age, settings);
    cashRates = emptyBuckets(); hourCap = null; noCapSplit = true;
  } else {
    rates = computeRowRates(match, age, settings);
    const cr = match.cashRates || rates;
    cashRates = makeRatesObj(cr.weekday||0, cr.saturday||0, cr.sunday||0, cr.publicHoliday||0);
    if(match.isSchoolStudent && periodFrom && periodTo){
      // The operator has marked this employee as a school student (under 18,
      // still attending high school or below) -- the hour cap is no longer a
      // fixed number they typed in, it's auto-decided per calc period from
      // the QLD school calendar, summed week by week (a fortnight can
      // straddle a school week and a holiday week, each with its own cap).
      // See schoolStudentHourCap above for the exact rule.
      const sc = schoolStudentHourCap(periodFrom, periodTo);
      hourCap = sc.cap;
      schoolCapBasis = sc.basis;
      schoolCapUnknownYear = sc.unknownYear;
    } else {
      hourCap = (match.hourCap!=null && match.hourCap!=="") ? Number(match.hourCap) : DEFAULT_HOUR_CAP;
    }
    noCapSplit = false;
  }
  return {
    id: uid("row"),
    employeeId: match? match.id : null,
    name: displayName + (splitLabel? " "+splitLabel : ""),
    baseName: displayName,
    splitLabel,
    isBirthdaySplit: !!splitLabel, // true for the "(Before BD)"/"(After BD)" pair buildRowsForStore creates when the employee's birthday falls inside the calc period
    age: age==null? "" : age,
    unregistered: !match,
    paymentType: match ? match.paymentType : null,
    rateMode: match ? match.rateMode : null,
    dob: match ? match.dob : null,
    taxType: match ? employeeTaxType(match) : "with",
    hours: buckets,
    adj: emptyBuckets(),
    rates, cashRates, hourCap, noCapSplit,
    schoolCapBasis, schoolCapUnknownYear,
    bonus: 0,
  };
}

async function loadAllData(){
  currentSettings = await idbGet("settings","app");
  if(!currentSettings){ currentSettings = defaultSettings(); await idbPut("settings", currentSettings); }
  if(!currentSettings.taxBrackets) currentSettings.taxBrackets = {withThreshold:annualBracketsWithThreshold(),noThreshold:annualBracketsNoThreshold(),medicareLevy:0.02};
  if(currentSettings.syncStaffInfoFully===undefined){ currentSettings.syncStaffInfoFully = false; await idbPut("settings", currentSettings); }
  if(currentSettings.otImportSource===undefined){ currentSettings.otImportSource = null; await idbPut("settings", currentSettings); }
  // Migrate the old {permanent:{...}, casual:{...}} penalty shape (two
  // independently-configured multiplier sets) to the new flat shared shape
  // {saturday, sunday, publicHoliday, casualLoading} -- Casual no longer has
  // its own separately-configured Saturday/Sunday/PH multiplier, it always
  // reuses the FT/PT set. Carry the user's own FT/PT multipliers and casual
  // loading forward rather than silently resetting to defaults.
  if(currentSettings.penalty && currentSettings.penalty.permanent){
    const old = currentSettings.penalty;
    currentSettings.penalty = {
      saturday: old.permanent.saturday,
      sunday: old.permanent.sunday,
      publicHoliday: old.permanent.publicHoliday,
      casualLoading: (old.casual && old.casual.loading!=null) ? old.casual.loading : 0.25,
    };
    await idbPut("settings", currentSettings);
  }
  currentStores = sortStores(await idbAll("stores"));
  await ensureStoreOrder(); // one-off backfill for stores saved before the order feature existed
  currentEmployees = await idbAll("employees");
  await loadRealStores();
}
// Existing stores (saved before this feature) have no `.order` at all --
// give each one its current (creation-order) position as a starting value,
// once, so the very first ↑/↓ click has a real distinct number to swap
// against instead of silently doing nothing (undefined <-> undefined).
// currentStores is already sortStores()-sorted when this runs, and a
// stable sort with every key missing (treated as 0) leaves creation order
// untouched -- so this backfill doesn't visibly reorder anything for Jeff,
// it just makes the order concrete.
async function ensureStoreOrder(){
  if(!currentStores.some(s=>s.order==null)) return;
  for(let i=0;i<currentStores.length;i++){
    if(currentStores[i].order==null){ currentStores[i].order = i; await idbPut("stores", currentStores[i]); }
  }
}

// swap-based manual-order pattern already used for employees, see
// reorderEmp()/renderEmpList()) everywhere it's (re)loaded, so every list
// built straight from currentStores (分店管理's own table, the QLD public

// Object.keys(ws.stores) against this same `.order` separately, since that

function sortStores(stores){ return [...stores].sort((a,b)=>(a.order??0)-(b.order??0)); }
async function saveStore(s){ await idbPut("stores", s); currentStores = sortStores(await idbAll("stores")); autoBackupIfEnabled(); }

async function loadRealStores(){
  const { data, error } = await sb.from("stores").select("id,name").eq("is_active", true);
  if(error){ console.error("loadRealStores failed", error); realStores = []; return; }
  realStores = data || [];
}
// 名稱完全相符（不分大小寫、去頭尾空白）才算配對到 —— Payroll 分店資料若沒有
// 對應到任何一個真實分店，syncEmployeesFromStaffInfo 就完全不會動它。
function findRealStore(payrollStore){
  if(!payrollStore) return null;
  const name = (payrollStore.name||"").trim().toLowerCase();
  if(!name) return null;
  return realStores.find(s=>(s.name||"").trim().toLowerCase()===name) || null;
}
// 抓這個真實分店目前「在職」、且不是 NON_PAYROLL_STAFF_ROLES 裡角色的員工，
// 對應到 syncEmployeesFromStaffInfo 需要的 5 個共通欄位 + cash-in-hand 狀態。
async function fetchRealStaffForStore(realStoreId){
  const { data, error } = await sb
    .from("user_stores")
    .select("profile_id, profiles(*)")
    .eq("store_id", realStoreId);
  if(error){ console.error("fetchRealStaffForStore failed", error); return []; }
  const seen = new Set();
  const out = [];
  (data||[]).forEach(row=>{
    const p = row.profiles;
    if(!p || seen.has(p.id)) return;
    if(!p.is_active) return;
    if(NON_PAYROLL_STAFF_ROLES.includes(p.role)) return;
    seen.add(p.id);
    out.push({
      profileId: p.id,
      name: `${p.first_name||""} ${p.last_name||""}`.trim() || p.email || "(未命名)",
      dob: p.date_of_birth || null,
      tfn: p.tax_file_number || "",
      email: p.email || "",
      phone: p.phone || "",
      hireDate: p.hire_date || null,
      cashInHand: !!p.cash_in_hand,
    });
  });
  return out;
}
// 把某個 Payroll 分店（store）跟它配對到的真實分店（real，findRealStore 的結
// 果 —— 呼叫端已保證非 null）之間的員工資料同步進 currentEmployees：
//  - Staff Information 有、這邊還沒登記過的（用 profileId 比對）→ 新增一筆已
//    連結的員工，付款方式預設 FT，除非勾了 cash-in-hand 就直接帶入 "CA"（這個
//    app 原本就有的「整筆薪水都算 cash-in-hand」付款方式，不是新類別）。
//  - 已連結的 → 更新 dob/tfn/email/phone/hireDate 這 5 個共通欄位；若目前勾了
//    cash-in-hand 但 paymentType 還不是 "CA"，強制改成 "CA" 並把費率歸零。
//    姓名、銀行資訊、費率等其他欄位不受影響 —— 這些不在 Jeff 要求同步的欄位裡，
//    仍由 Payroll 這邊自己維護。
//  - 之前連結過、但這次抓回來的名單裡已經沒有（整個人從 Staff Information /
//    這個分店移除，或被設為非在職）的 → 比照「離職」按鈕的做法，設定
//    resignDate（用今天日期），不會直接刪除，保留過去的薪水計算紀錄。
//    ⚠️ Jeff：這個「視同離職、不直接刪除」的處理方式，是我自己判斷的 —— 你
//    原本的要求沒有明講這種情況要怎麼處理，如果你比較希望直接刪除，之後跟我
//    說一聲即可調整。
async function syncEmployeesFromStaffInfo(store, real){
  const realStaff = await fetchRealStaffForStore(real.id);
  const byProfileId = new Map();
  currentEmployees.forEach(e=>{ if(e.storeId===store.id && e.profileId) byProfileId.set(e.profileId, e); });
  const seenProfileIds = new Set();
  let created = 0, updated = 0, resigned = 0;

  for(const rs of realStaff){
    seenProfileIds.add(rs.profileId);
    const existing = byProfileId.get(rs.profileId);
    if(existing){
      let changed = false;
      ["dob","tfn","email","phone"].forEach(k=>{ if(existing[k]!==rs[k]){ existing[k]=rs[k]; changed=true; } });
      if(existing.hireDate!==rs.hireDate){ existing.hireDate = rs.hireDate; changed=true; }
      if(existing.resignDate){ existing.resignDate = null; changed=true; } // Staff Information 那邊重新在職了
      if(rs.cashInHand && existing.paymentType!=="CA"){
        existing.paymentType = "CA";
        existing.rateMode = "manual";
        existing.rates = {weekday:0,saturday:0,sunday:0,publicHoliday:0};
        existing.cashRates = {weekday:0,saturday:0,sunday:0,publicHoliday:0};
        changed = true;
      }
      if(changed){ await saveEmployee(existing); updated++; }
    } else {
      const id = "emp_"+await nextId("employee");
      const order = currentEmployees.filter(e=>e.storeId===store.id).length;
      const paymentType = rs.cashInHand ? "CA" : "FT";
      const level = (currentSettings.awardLevels[0]||{}).id;
      let rates, cashRates;
      if(paymentType==="CA"){
        rates = {weekday:0,saturday:0,sunday:0,publicHoliday:0};
        cashRates = {weekday:0,saturday:0,sunday:0,publicHoliday:0};
      } else {
        const age = rs.dob ? calcAge(rs.dob, toISO(new Date())) : null;
        const r = computeAwardRates(currentSettings, level, paymentType, age);
        rates = makeRatesObj(r.weekday,r.saturday,r.sunday,r.publicHoliday);
        cashRates = {...rates};
      }
      const emp = {
        id, storeId: store.id, profileId: rs.profileId, name: rs.name, dob: rs.dob,
        tfn: rs.tfn, email: rs.email, phone: rs.phone, hireDate: rs.hireDate || toISO(new Date()),
        resignDate: null, paymentType, level, taxType: "with", rateMode: "award",
        rates, cashRates, hourCap: null,
        bankAccountName: "", bankBsb: "", bankAccountNumber: "",
        documents: {}, order,
      };
      await saveEmployee(emp);
      created++;
    }
  }

  // Jeff (2026-09): Staff Information's data is still incomplete right now,
  // so a linked employee missing from this store's current Staff
  // Information list doesn't necessarily mean that person actually left --
  // it may just mean their Staff Information record hasn't been filled in
  // yet. So resigning a "missing" linked employee only happens when
  // 系統設置 > Staff Information 同步設定's "同步 OT Portal Staff 資料"
  // checkbox is turned ON (currentSettings.syncStaffInfoFully) -- with it
  // off (the default), a payroll employee that's already here is left
  // alone even if Staff Information doesn't (yet) show them for this
  // store, and additions/edits above still keep happening either way, only
  // the resign-on-missing step is skipped.
  if(currentSettings.syncStaffInfoFully){
    for(const [profileId, emp] of byProfileId){
      if(!seenProfileIds.has(profileId) && !emp.resignDate){
        emp.resignDate = toISO(new Date());
        await saveEmployee(emp);
        resigned++;
      }
    }
  }

  return { created, updated, resigned };
}

/* --- Tab 1「從 OT Portal 匯入」(Jeff, 2026-09-30) ---------------------------
   Pulls the same {storeName, employees:[{name, dailyHours, dailyRaw}]} shape
   parseRosterFromFiles()/parseRosterFromPaste() already produce, straight
   from OT Portal's own tables instead of an Excel file -- so the result
   feeds into the exact same ingestParsedStores() used by every other import
   path, and gets its typo-detection / cross-store / "未登記員工" confirmation
   modals for free, with no separate matching logic to maintain.

   Matching is still by NAME (ingestParsedStores' pipeline has always matched
   by name, not profileId) -- but names here come from `profiles.first_name/
   last_name`, the exact same convention fetchRealStaffForStore() already
   uses to build a synced employee's `.name`, so an employee that's been
   linked via "🔄 從 Staff Information 同步" (員工資料管理) matches exactly,
   no typo-detection needed. Jeff asked whether the "找不到員工資料" prompt
   would realistically ever fire now that employee data is linked to OT
   Portal -- answer: yes, still can, in three real cases: (1) a store's
   employees haven't been synced from Staff Information yet (that sync is a
   manual button, not automatic); (2) a roster_entries row has no profile_id
   at all (staff_name_raw fallback -- happens when that roster itself was
   imported from an Excel sheet whose name didn't match a profile at the
   time); (3) someone appears in OT Portal but was never added as a Payroll
   employee at all. So the existing "未登記" confirmation modal below still
   matters and is deliberately left in the pipeline, not bypassed.

   Break handling differs by source. roster_entries HAS a break column
   (break_half_hours, migration 0008 -- half-hour units, same as the Excel
   roster's "Break" row under each shift, e.g. 1 = 30min) so the Roster
   source subtracts it exactly the same way the Excel import already does
   (see fetchStoresFromRoster below). attendance_events has no break field
   at all, but doesn't need one: a real unpaid break there shows up as a gap
   between one clock-out and the next clock-in (two separate sessions that
   day), which dailyHours already adds up correctly on its own -- so every
   dailyRaw from the Attendance source gets brk:0 and that's correct, not a
   gap. */
function otPortalPersonName(prof){
  if(!prof) return "(未命名)";
  const n = `${prof.first_name||""} ${prof.last_name||""}`.trim();
  return n || prof.email || "(未命名)";
}
// Local reimplementation of src/lib/attendance.js's pairEventsIntoSessions --
// this static page has no build step / ES module imports from src/, so the
// pairing logic (alternate clock_in/clock_out chronologically per profile,
// tolerating an out-of-order anomaly rather than throwing) is duplicated
// here rather than shared. Keep the two in sync by hand if the pairing rule
// itself ever changes.
function pairEventsIntoSessionsLocal(events){
  const sorted = [...events].sort((a,b)=> new Date(a.occurred_at) - new Date(b.occurred_at));
  const sessions = [];
  let openIn = null;
  for(const ev of sorted){
    if(ev.event_type==="clock_in"){
      if(openIn) sessions.push({clockIn:openIn, clockOut:null, inProgress:true});
      openIn = ev;
    } else {
      sessions.push({clockIn:openIn, clockOut:ev, inProgress:false});
      openIn = null;
    }
  }
  if(openIn) sessions.push({clockIn:openIn, clockOut:null, inProgress:true});
  return sessions.map(s=>({
    ...s,
    date: s.clockIn ? isoLocalDate(s.clockIn.occurred_at) : null,
    minutes: (s.clockIn && s.clockOut) ? Math.max(0, Math.round((new Date(s.clockOut.occurred_at)-new Date(s.clockIn.occurred_at))/60000)) : null,
  }));
}
function isoLocalDate(occurredAt){
  const d = new Date(occurredAt);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function fmtLocalHM(occurredAt){
  const d = new Date(occurredAt);
  return `${d.getHours()}:${pad2(d.getMinutes())}`;
}
// roster_entries has no unpaid-break column and no break-time information
// anywhere else in OT Portal, so every roster-sourced shift is imported as
// continuous (brk:0) -- see the header comment above.
async function fetchStoresFromRoster(dateFrom, dateTo){
  const warnings = [];
  const storeIds = realStores.map(s=>s.id);
  if(!storeIds.length) return {stores:[], warnings};
  const { data: periods, error: perr } = await sb
    .from('roster_periods')
    .select('id, store_id, week_start_date, week_end_date')
    .in('store_id', storeIds)
    .lte('week_start_date', dateTo)
    .gte('week_end_date', dateFrom);
  if(perr) throw perr;
  if(!periods || !periods.length) return {stores:[], warnings};
  const periodIds = periods.map(p=>p.id);
  const { data: entries, error: eerr } = await sb
    .from('roster_entries')
    .select('roster_period_id, profile_id, staff_name_raw, work_date, start_time, end_time, break_half_hours, profiles(first_name,last_name,email)')
    .in('roster_period_id', periodIds)
    .gte('work_date', dateFrom)
    .lte('work_date', dateTo);
  if(eerr) throw eerr;
  const periodById = new Map(periods.map(p=>[p.id,p]));
  const byStore = new Map(); // realStoreId -> {storeName, employees:Map(lowerName->{name,dailyHours,dailyRaw})}
  for(const row of (entries||[])){
    const period = periodById.get(row.roster_period_id);
    if(!period) continue;
    const realStore = realStores.find(s=>s.id===period.store_id);
    if(!realStore) continue;
    if(!row.start_time || !row.end_time){ continue; } // an entry with no times recorded contributes no hours
    const sH = timeToHours(row.start_time.slice(0,5));
    const eH = timeToHours(row.end_time.slice(0,5));
    const name = row.profiles ? otPortalPersonName(row.profiles) : ((row.staff_name_raw||"").trim() || "(未命名)");
    if(sH==null || eH==null || eH<=sH){
      warnings.push(`[OT Portal 班表 / ${realStore.name}] ${name} 在 ${row.work_date} 的班表時間無法判讀（${row.start_time}–${row.end_time}），已略過這筆`);
      continue;
    }
    // break_half_hours (migration 0008) is in HALF-HOUR units, same as the
    // Excel roster import's "Break" row (brk) -- e.g. 1 = 30min, 2 = 1hr --
    // so it subtracts the exact same way Jeff's Excel path already does.
    const brk = Number(row.break_half_hours)||0;
    let worked = (eH-sH) - brk*0.5;
    if(worked<0) worked = 0;
    let bucket = byStore.get(realStore.id);
    if(!bucket){ bucket = {storeName: realStore.name, employees: new Map()}; byStore.set(realStore.id, bucket); }
    const key = name.trim().toLowerCase();
    let emp = bucket.employees.get(key);
    if(!emp){ emp = {name, dailyHours:{}, dailyRaw:{}}; bucket.employees.set(key, emp); }
    emp.dailyHours[row.work_date] = (emp.dailyHours[row.work_date]||0) + worked;
    emp.dailyRaw[row.work_date] = {start: row.start_time.slice(0,5), end: row.end_time.slice(0,5), brk};
  }
  const stores = Array.from(byStore.values()).map(b=>({
    storeName: b.storeName, employees: Array.from(b.employees.values()),
    warnings: [], dateIssues: [], sourceLabel: "OT Portal 班表",
  }));
  return {stores, warnings};
}
// attendance_events already reflects any manager/admin correction (edits
// are applied in place on the punch itself, migration 0062) -- no separate
// "as edited" query needed, this IS the corrected data.
async function fetchStoresFromAttendance(dateFrom, dateTo){
  const warnings = [];
  const storeIds = realStores.map(s=>s.id);
  if(!storeIds.length) return {stores:[], warnings};
  // Fetch each profile's FULL punch history at these stores (not bounded to
  // the selected period) and pair chronologically before filtering to the
  // period -- same reasoning as AttendanceLogTable.jsx: a session that
  // started just before dateFrom, or is still open past dateTo, needs its
  // other half to pair correctly; bounding the query itself risks silently
  // splitting a real session in half at the query's own edge.
  const { data: events, error } = await sb
    .from('attendance_events')
    .select('id, profile_id, store_id, event_type, occurred_at, profiles(first_name,last_name,email)')
    .in('store_id', storeIds)
    .order('occurred_at', { ascending: true });
  if(error) throw error;
  const byProfile = new Map();
  (events||[]).forEach(ev=>{
    if(!byProfile.has(ev.profile_id)) byProfile.set(ev.profile_id, []);
    byProfile.get(ev.profile_id).push(ev);
  });
  const byStore = new Map();
  let openCount = 0;
  for(const [, evs] of byProfile){
    const sessions = pairEventsIntoSessionsLocal(evs);
    for(const s of sessions){
      if(s.inProgress){ openCount++; continue; } // still clocked in, no clock-out yet -- not counted, same as dailyTotals()
      if(!s.date || s.date<dateFrom || s.date>dateTo || s.minutes==null) continue;
      const realStore = realStores.find(rs=>rs.id===(s.clockIn.store_id||s.clockOut.store_id));
      if(!realStore) continue;
      const name = otPortalPersonName(s.clockIn.profiles || s.clockOut.profiles);
      let bucket = byStore.get(realStore.id);
      if(!bucket){ bucket = {storeName: realStore.name, employees: new Map()}; byStore.set(realStore.id, bucket); }
      const key = name.trim().toLowerCase();
      let emp = bucket.employees.get(key);
      if(!emp){ emp = {name, dailyHours:{}, dailyRaw:{}}; bucket.employees.set(key, emp); }
      emp.dailyHours[s.date] = (emp.dailyHours[s.date]||0) + s.minutes/60;
      emp.dailyRaw[s.date] = {start: fmtLocalHM(s.clockIn.occurred_at), end: fmtLocalHM(s.clockOut.occurred_at), brk:0};
    }
  }
  if(openCount>0) warnings.push(`有 ${openCount} 筆打卡紀錄目前還沒有對應的下班紀錄（still clocked in），這幾筆這次不計入匯入時數。`);
  const stores = Array.from(byStore.values()).map(b=>({
    storeName: b.storeName, employees: Array.from(b.employees.values()),
    warnings: [], dateIssues: [], sourceLabel: "OT Portal Attendance Logs",
  }));
  return {stores, warnings};
}
async function importFromOTPortal(){
  if(!workingSheet){ return; }
  const source = currentSettings.otImportSource;
  if(!source){ toast("請先到「系統設置 > 匯入班表來源」選擇要匯入 OT Portal 班表還是 Attendance Logs"); return; }
  await loadRealStores(); // refresh against 分店管理 current active store list
  if(!realStores.length){ toast("「分店管理」目前沒有任何啟用中的分店"); return; }
  try{
    const res = source==="attendance"
      ? await fetchStoresFromAttendance(workingSheet.dateFrom, workingSheet.dateTo)
      : await fetchStoresFromRoster(workingSheet.dateFrom, workingSheet.dateTo);
    if(!res.stores.length){ toast("OT Portal 在目前選擇的日期區間內沒有可匯入的資料"); return; }
    await ingestParsedStores(res.stores, res.warnings);
  }catch(err){ toast("從 OT Portal 匯入失敗: "+err.message); }
}
