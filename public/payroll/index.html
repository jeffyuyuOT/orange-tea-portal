async function defaultDateRangeForNew(){
  const sheets = await idbAll("calcSheets");
  if(sheets.length){
    sheets.sort((a,b)=> a.dateTo<b.dateTo?1:-1);
    const prev = sheets[0];
    // Preserve the previous calc sheet's period length (e.g. 7-day weekly, or
    // 14-day fortnightly) instead of always assuming fortnightly -- otherwise a
    // shop running weekly pay periods gets a new sheet whose date range no
    // longer matches the roster files they're about to import.
    const prevLen = Math.round((fromISO(prev.dateTo) - fromISO(prev.dateFrom)) / 86400000);
    const from = addDays(prev.dateTo,1);
    return {from, to: addDays(from, prevLen)};
  }
  const today = toISO(new Date());
  return {from: today, to: addDays(today,13)};
}
// Pre-populates a new calc sheet's stores/employees from the most recent calc
// sheet on record, with every hour bucket at zero — so the output table already
// lists everyone before any roster is imported.
async function buildSkeletonForNewSheet(dateFrom, dateTo){
  const sheets = await idbAll("calcSheets");
  if(!sheets.length) return {};
  sheets.sort((a,b)=> a.dateTo<b.dateTo?1:-1);
  const last = sheets[0];
  const stores = {};
  for(const storeId of Object.keys(last.stores||{})){
    const store = currentStores.find(s=>s.id===storeId);
    if(!store) continue;
    const activeEmps = currentEmployees.filter(e=>e.storeId===storeId && !e.resignDate).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!activeEmps.length) continue;
    const parsed = {employees: activeEmps.map(e=>({name:e.name, dailyHours:{}, dailyRaw:{}}))};
    const rows = buildRowsForStore(store, parsed, currentEmployees, {dateFrom,dateTo}, currentSettings);
    stores[storeId] = {storeName: store.name, rows};
  }
  return stores;
}

  const weekendSplit = currentSettings.weekendSplit;

// When a pay period spans multiple weeks and each roster file only covers one
// week, the same store name shows up in more than one parsed entry (one per
// file). Merge those into a single entry per store -- unioning employees and
// summing their daily hours by calendar date -- so a second file's week
// doesn't wholesale overwrite the first file's week for that store.
function mergeParsedStores(parsedStores){
  const byName = new Map();
  const order = [];
  for(const ps of parsedStores){
    const key = (ps.storeName||"").trim().toLowerCase();
    if(!byName.has(key)){
      byName.set(key, {storeName: ps.storeName, employees: [], warnings: [], dateIssues: [], sourceLabels: []});
      order.push(key);
    }
    const target = byName.get(key);
    if(ps.sourceLabel && !target.sourceLabels.includes(ps.sourceLabel)) target.sourceLabels.push(ps.sourceLabel);
    (ps.dateIssues||[]).forEach(di=>target.dateIssues.push({...di, sourceLabel: ps.sourceLabel}));
    for(const emp of (ps.employees||[])){
      let existing = target.employees.find(e=>e.name.trim().toLowerCase()===emp.name.trim().toLowerCase());
      if(!existing){ existing = {name:emp.name, dailyHours:{}, dailyRaw:{}}; target.employees.push(existing); }
      for(const iso of Object.keys(emp.dailyHours||{})){
        existing.dailyHours[iso] = (existing.dailyHours[iso]||0) + emp.dailyHours[iso];
      }
      Object.assign(existing.dailyRaw, emp.dailyRaw||{});
    }
  }
  return order.map(k=>{ const t=byName.get(k); t.sourceLabel = t.sourceLabels.join(" + "); return t; });
}
// Standard edit-distance (insert/delete/substitute) between two strings,
// case-insensitive. Used to catch roster names that are probably a typo of
// an existing employee's name rather than a genuinely different person.
function levenshtein(a,b){
  a = (a||"").trim().toLowerCase(); b = (b||"").trim().toLowerCase();
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = new Array(n+1);
  for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){
    let prev = dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp = dp[j];
      dp[j] = a[i-1]===b[j-1] ? prev : 1+Math.min(prev, dp[j], dp[j-1]);
      prev = tmp;
    }
  }
  return dp[n];
}
// Finds the closest-named employee among `candidates` to `name`, if the two
// are close enough to plausibly be a typo of each other rather than two
// different people -- an exact match is not a "fuzzy" match (handled
// elsewhere) and is never returned here.
function findFuzzyEmployeeMatch(name, candidates){
  name = (name||"").trim();
  if(!name || !candidates.length) return null;
  let best=null, bestDist=Infinity;
  for(const c of candidates){
    const cname = (c.name||"").trim();
    if(!cname) continue;
    const d = levenshtein(name, cname);
    if(d<bestDist){ bestDist=d; best=c; }
  }
  if(!best || bestDist===0) return null;
  const maxLen = Math.max(name.length, best.name.trim().length);
  if(maxLen===0) return null;
  // Small edit distance relative to name length -- catches a single missing/
  // extra/wrong character or a transposed pair -- but not names that are
  // just genuinely different people.
  const threshold = maxLen<=4 ? 1 : Math.max(1, Math.floor(maxLen*0.3));
  return bestDist<=threshold ? {match:best, distance:bestDist} : null;
}
// Roster names that don't exactly match ANY employee record (same store or
// otherwise -- an exact match elsewhere is handled by detectCrossStoreAppearances
// instead) but are close enough to one to plausibly be a misspelling. Same-
// store candidates are preferred over other stores' employees when both are
// close, since a typo is far more likely than the employee actually working
// at a different store under a near-identical name.
function detectFuzzyNameMatches(pending){
  const found = [];
  for(const p of pending){
    for(const pe of p.ps.employees){
      const exactAnywhere = currentEmployees.find(e=>e.name.trim().toLowerCase()===pe.name.trim().toLowerCase());
      if(exactAnywhere) continue; // exact match (same store or cross-store) -- not a typo case
      const sameStoreEmps = currentEmployees.filter(e=>e.storeId===p.store.id);
      const otherEmps = currentEmployees.filter(e=>e.storeId!==p.store.id);
      const fuzzy = findFuzzyEmployeeMatch(pe.name, sameStoreEmps) || findFuzzyEmployeeMatch(pe.name, otherEmps);
      if(fuzzy) found.push({pe, pending:p, match:fuzzy.match, distance:fuzzy.distance});
    }
  }
  return found;
}

// Finds every roster shift on 24 December that (a) actually crosses 6pm --
// the QLD part-day public-holiday cutover (see splitChristmasEveShift) --
// AND (b) has a recorded break, since only then does it matter whether the
// break fell before or after 6pm. Runs against `pending` (every store's
// parsed roster, before typo-fix/cross-store/Direct extraction moves `pe`
// objects around) but mutates `pe.dailyRaw[iso]` in place, so whichever
// pipeline later reads that same `pe` (normal per-store rows, a cross-store
// transfer, or a Direct pool) sees the confirmed answer either way.
function detectXmasEveBreakCases(pending){
  const cases = [];
  for(const {ps, store} of pending){
    for(const pe of ps.employees){
      for(const iso in (pe.dailyRaw||{})){
        if(!isQldChristmasEve(iso)) continue;
        const raw = pe.dailyRaw[iso];
        if(!raw || !raw.brk) continue; // no recorded break -- nothing to ask
        const sH = timeToHours(raw.start), eH = timeToHours(raw.end);
        if(sH==null || eH==null || eH<=sH) continue;
        if(sH>=QLD_XMAS_EVE_CUTOVER_HOUR || eH<=QLD_XMAS_EVE_CUTOVER_HOUR) continue; // doesn't actually cross 6pm
        const span = eH-sH;
        const preSpan = QLD_XMAS_EVE_CUTOVER_HOUR-sH, postSpan = eH-QLD_XMAS_EVE_CUTOVER_HOUR;
        const totalBreakHours = raw.brk*0.5;
        const maxAfterBreak = round2(Math.min(totalBreakHours, postSpan));
        const defaultAfterBreak = round2(totalBreakHours * (span>0 ? postSpan/span : 0)); // proportional estimate, pre-filled
        cases.push({pe, iso, storeName: store.name, start: raw.start, end: raw.end, totalBreakHours, defaultAfterBreak, maxAfterBreak});
      }
    }
  }
  return cases;
}
// Confirms with the user, per shift, how much of the recorded break on a
// 24-Dec shift crossing 6pm actually fell after 6pm -- the roster only
// records a break DURATION, not when it was taken, so this can't be read off
// the file automatically. Pre-filled with a proportional-by-clock-time
// estimate; the user can adjust or accept it. Writes the confirmed value
// onto pe.dailyRaw[iso].afterBreakHours, which splitChristmasEveShift then

    </tr>`).join("");
    const m = openModal(`

  });

// Employees whose roster appearance is in a DIFFERENT store than their own
// "主要記錄分店" (home store) -- matched by employee RECORD (storeId), not
// just name, so two different people who happen to share a name across two
// stores' own employee lists are never confused with each other: a name is
// only treated as a cross-store appearance when it does NOT match anyone on
// the roster's own store's employee list.
function detectCrossStoreAppearances(pending){
  const found = [];
  for(const p of pending){
    for(const pe of p.ps.employees){
      const sameStoreMatch = currentEmployees.find(e=>e.storeId===p.store.id && e.name.trim().toLowerCase()===pe.name.trim().toLowerCase());
      if(sameStoreMatch) continue;
      const foreignMatch = currentEmployees.find(e=>e.storeId!==p.store.id && e.name.trim().toLowerCase()===pe.name.trim().toLowerCase());
      if(!foreignMatch) continue;
      const homeStore = currentStores.find(s=>s.id===foreignMatch.storeId);
      if(!homeStore) continue;
      found.push({pe, foreignPending:p, foreignMatch, homeStore});
    }
  }
  return found;
}

// Applies confirmed cross-store hour transfers to workingSheet.stores: adds the
// transferred hours (classified using the HOME store's calendar) as an
// adjustment on that employee's home-store row -- creating the row if this is
// the first time they have hours there this period -- and queues a support-
// ledger charge (persisted into supportLedger once the calc sheet is saved).
function applyCrossStoreTransfers(pendingTransfers, warnings){
  for(const t of pendingTransfers){
    const buckets = sumDailyIntoBuckets(t.pe.dailyHours, t.homeStore, currentSettings.weekendSplit, workingSheet.dateFrom, workingSheet.dateTo, t.pe.dailyRaw);
    const totalHours = round2(Object.values(buckets).reduce((a,b)=>a+b,0));
    if(totalHours<=0) continue; // nothing in the selected period, skip silently
    if(!workingSheet.stores[t.homeStore.id]) workingSheet.stores[t.homeStore.id] = {storeName:t.homeStore.name, rows:[]};
    const homeSd = workingSheet.stores[t.homeStore.id];
    let row = homeSd.rows.find(r=>r.employeeId===t.foreignMatch.id && !r.splitLabel);
    if(!row){
      const age = t.foreignMatch.dob ? calcAge(t.foreignMatch.dob, workingSheet.dateTo) : null;
      row = makeRow(t.foreignMatch, t.foreignMatch.name, age, emptyBuckets(), currentSettings, "");
      homeSd.rows.push(row);
    }
    Object.keys(buckets).forEach(k=>{ row.adj[k] = (row.adj[k]||0) + buckets[k]; });
    row.crossStoreFrom = row.crossStoreFrom || [];
    row.crossStoreFrom.push({storeName:t.foreignStore.name, hours: totalHours});
    recalcRowLocal(row);
    // Inter-store settlement amount, at the employee's normal flat award/manual
    // rate per bucket type -- independent of the home-store row's own hour-cap
    // / cash-rate split, which is about THAT employee's own pay, not what one
    // store owes another for the labor.
    let rates;
    if(t.foreignMatch.paymentType==="CA" || t.foreignMatch.rateMode==="manual"){
      rates = t.foreignMatch.rates;
    } else {
      const age = t.foreignMatch.dob ? calcAge(t.foreignMatch.dob, workingSheet.dateTo) : null;
      const r = computeAwardRates(currentSettings, t.foreignMatch.level, t.foreignMatch.paymentType, age);
      rates = makeRatesObj(r.weekday, r.saturday, r.sunday, r.publicHoliday);
    }
    let amount = 0;
    ["weekday","saturday","sunday","publicHoliday"].forEach(k=>{ amount += (buckets[k]||0)*(rates[k]||0); });
    amount = round2(amount);
    workingSheet.pendingCharges = workingSheet.pendingCharges || [];
    workingSheet.pendingCharges.push({
      employeeName: t.foreignMatch.name,
      debtorStoreId: t.foreignStore.id, debtorStoreName: t.foreignStore.name,
      creditorStoreId: t.homeStore.id, creditorStoreName: t.homeStore.name,
      hours: totalHours, amount,
    });
    warnings.push(`「${t.foreignMatch.name}」在「${t.foreignStore.name}」的 ${fmtHours(totalHours)} 小時已計入主店「${t.homeStore.name}」，儲存後將於支援款項紀錄新增一筆積欠款項（$${fmtMoney(amount)}）。`);
  }
}
// Payment type "Direct": these employees pick up shifts at multiple stores
// in the same period and are paid ONE pooled amount (not a per-store
// amount like everyone else) -- so before any of the normal per-store /
// cross-store logic runs, pull every roster appearance of a Direct
// employee (their own home store's roster included) out of `pending`
// entirely and group them by employee. Matched purely by name, same as
// cross-store detection, and run AFTER the typo-fix step so a corrected
// name is what gets matched here too.
function collectDirectPools(pending){
  const pools = new Map(); // employeeId -> {emp, appearances:[{pe, store}]}
  for(const p of pending){
    for(const pe of Array.from(p.ps.employees)){
      const match = currentEmployees.find(e=>e.paymentType==="Direct" && e.name.trim().toLowerCase()===pe.name.trim().toLowerCase());
      if(!match) continue;
      p.ps.employees = p.ps.employees.filter(e=>e!==pe);
      if(!pools.has(match.id)) pools.set(match.id, {emp:match, appearances:[]});
      pools.get(match.id).appearances.push({pe, store:p.store});
    }
  }
  return pools;
}
function makeDirectRow(emp, pooledBuckets, storeContrib){
  return {
    id: uid("row"),
    employeeId: emp.id,
    name: emp.name,
    baseName: emp.name,
    splitLabel: null,
    isBirthdaySplit: false,
    age: emp.dob ? calcAge(emp.dob, workingSheet.dateTo) : "",
    unregistered: false,
    paymentType: "Direct",
    rateMode: null,
    dob: emp.dob,
    taxType: employeeTaxType(emp),
    hours: pooledBuckets,
    adj: emptyBuckets(),
    rates: emptyBuckets(), cashRates: emptyBuckets(), hourCap: null, noCapSplit: true,
    bonus: 0,
    directCashRate: Number(emp.directCashRate)||0,
    directPhMultiplier: emp.directPhMultiplier!=null ? Number(emp.directPhMultiplier) : 1,
    directExtraHr: Number(emp.directExtraHr)||0,
    directHourLimit: Number(emp.directHourLimit)||0,
    directBonusHr: 0,
    directStoreHours: storeContrib,
  };
}
// Builds/updates one pooled row per Direct employee under their home store
// (workingSheet.stores[emp.storeId] -- creating that store's entry if this
// is the first time they have hours there this period), combining hours
// from every store they appeared on, each classified using THAT store's
// own calendar/public holidays since that's where the shift actually
// happened. Mirrors applyCrossStoreTransfers' "create/append the home-store
// row" pattern; unlike a cross-store transfer this is NOT a support-ledger
// charge between stores -- the whole pooled amount is simply paid out (in
// cash) from the employee's home store.
function applyDirectPools(pools, warnings){
  for(const {emp, appearances} of pools.values()){
    const homeStore = currentStores.find(s=>s.id===emp.storeId);
    if(!homeStore){ warnings.push(`「${emp.name}」(Direct) 找不到主要記錄分店，已略過本次匯入的時數。`); continue; }
    const pooledBuckets = emptyBuckets();
    const storeContrib = [];
    for(const {pe, store} of appearances){
      const buckets = sumDailyIntoBuckets(pe.dailyHours, store, currentSettings.weekendSplit, workingSheet.dateFrom, workingSheet.dateTo, pe.dailyRaw);
      const hrs = round2(Object.values(buckets).reduce((a,b)=>a+b,0));
      if(hrs<=0) continue; // nothing in the selected period from this store, skip silently
      Object.keys(buckets).forEach(k=>{ pooledBuckets[k]=(pooledBuckets[k]||0)+buckets[k]; });
      storeContrib.push({storeName:store.name, hours:hrs});
    }
    if(!storeContrib.length) continue;
    if(!workingSheet.stores[homeStore.id]) workingSheet.stores[homeStore.id] = {storeName:homeStore.name, rows:[]};
    const homeSd = workingSheet.stores[homeStore.id];
    let row = homeSd.rows.find(r=>r.employeeId===emp.id && r.paymentType==="Direct");
    if(!row){
      row = makeDirectRow(emp, pooledBuckets, storeContrib);
      homeSd.rows.push(row);
    } else {
      Object.keys(pooledBuckets).forEach(k=>{ row.hours[k]=(row.hours[k]||0)+pooledBuckets[k]; });
      row.directStoreHours = (row.directStoreHours||[]).concat(storeContrib);
    }
    recalcRowLocal(row);
  }
}
// Roster names that -- after the typo-fix and cross-store steps above have

// other store). These would otherwise be silently imported as blank-rate
// "未登記" placeholder rows; instead the user is asked up front which of them

function detectUnregisteredEmployees(pending){

async function ingestParsedStores(parsedStores, warnings){
  warnings = warnings||[];
  parsedStores = mergeParsedStores(parsedStores);
  // Resolve (but don't yet save) each parsed store against existing records, and
  // collect any date-range issues so we can confirm with the user before committing.
  const pending = [];
  // Jeff, 2026-09-30 (investigating "sunnybank不能調到最上面"): if an
  // import batch creates MORE THAN ONE brand-new store in this same loop,
  // every one of them used to get the exact same `order: currentStores.length`
  // (currentStores itself is never mutated inside this loop, so that
  // expression stayed constant across iterations) -- a tie that the ↑/↓
  // buttons can still resolve one click at a time (each click always swaps
  // two ADJACENT stores and re-persists both), but it's not a sound
  // starting state, and depending on exactly which stores tied and in what
  // creation order the DB happens to return them, a store that "should"
  // sort right after an existing one could initially land somewhere less
  // obvious. Give each new store in this batch its own distinct,
  // increasing order value instead, so ties across a multi-store import
  // never happen in the first place.
  let nextNewStoreOrder = currentStores.length;
  for(const ps of parsedStores){
    let store = currentStores.find(s=>s.name.trim().toLowerCase()===ps.storeName.trim().toLowerCase());
    let isNewStore = false;
    if(!store){
      const id = "store_"+await nextId("store");
      store = {id, name: ps.storeName||("分店"+id), publicHolidays:[], order: nextNewStoreOrder};
      nextNewStoreOrder += 1;
      isNewStore = true;
    }
    pending.push({ps, store, isNewStore});
  }
  // Catch likely typos before anything else: a roster name with no exact
  // match anywhere but a close one somewhere gets a chance to be corrected
  // to the real employee's name up front, so cross-store detection and the
  // rest of the pipeline (which all match by exact name) see the corrected
  // name from here on rather than quietly treating the typo as "未登記".
  const fuzzyMatches = detectFuzzyNameMatches(pending);
  if(fuzzyMatches.length) await showFuzzyNameModal(fuzzyMatches);
  // Any shift on 24 Dec that crosses the 6pm QLD part-day-public-holiday
  // cutover AND has a recorded break needs the user to say how much of that
  // break fell after 6pm, so the pay split is exact rather than a proportional
  // guess -- ask before building any rows (see splitChristmasEveShift).
  const xmasEveBreakCases = detectXmasEveBreakCases(pending);
  if(xmasEveBreakCases.length) await showXmasEveBreakModal(xmasEveBreakCases);
  // Direct employees are pulled out of the normal per-store roster lists
  // FIRST (before cross-store / unregistered detection even look at them) --
  // their hours are pooled across every store they appear on and paid as one
  // amount at their home store, so they must never be treated as either a
  // normal per-store row or a cross-store transfer.
  const directPools = collectDirectPools(pending);
  const crossAppearances = detectCrossStoreAppearances(pending);
  const pendingTransfers = [];
  if(crossAppearances.length){
    const importToHome = await showCrossStoreModal(crossAppearances);
    if(importToHome){
      for(const {pe, foreignPending, foreignMatch, homeStore} of crossAppearances){
        // Remove from the foreign (roster) store's employee list so it isn't
        // ALSO counted there, and queue it to be added to the home store
        // instead (as an adjustment against that employee's home-store row,
        // applied after all stores' normal rows are built in commit()).
        foreignPending.ps.employees = foreignPending.ps.employees.filter(e=>e!==pe);
        pendingTransfers.push({pe, foreignStore:foreignPending.store, foreignMatch, homeStore});
      }
    }
  }
  // Anyone still unmatched at this point (not a typo-fixed name, not a cross-
  // store employee) is genuinely unregistered -- confirm which of them the
  // user actually wants imported before building any rows.
  const unregistered = detectUnregisteredEmployees(pending);
  if(unregistered.length) await showUnregisteredModal(unregistered);
  const allDateIssues = [];
  pending.forEach(({ps, store})=>{
    (ps.dateIssues||[]).forEach(di=>{
      allDateIssues.push({source: di.sourceLabel||ps.sourceLabel||store.name, expected: di.expected, got: di.got, gotIso: di.gotIso});
    });
  });
  const commit = async ()=>{
    if(!workingSheet.stores) workingSheet.stores={};
    const bdayNotes = new Set();
    for(const {ps, store, isNewStore} of pending){
      if(isNewStore){
        await saveStore(store);
        warnings.push(`已自動建立新分店「${store.name}」，請於「資料管理→分店管理」補齊公眾假期設定。`);
      }
      // Import is authoritative for HOURS on this store: employees not
      // present in the newly parsed roster (across all files for this
      // store) are dropped from the output (buildRowsForStore only emits
      // rows for employees found in ps.employees). Any cross-store employee
      // was already removed from ps.employees above, so they don't ALSO get
      // a row here. It is NOT authoritative for hand-entered 補weekday/
      // weekend/public holiday hr or Bonus -- buildRowsForStore carries
      // those forward from this store's existing rows (below) for any
      // employee who still matches, precisely so a (re-)import can never
      // silently wipe out adjustments the operator already recorded.
      const oldRows = (workingSheet.stores[store.id] && workingSheet.stores[store.id].rows) || [];
      const rows = buildRowsForStore(store, ps, currentEmployees, workingSheet, currentSettings, oldRows);
      workingSheet.stores[store.id] = {storeName:store.name, rows};
      // Flag any employee whose birthday fell inside this period. A fixed-rate
      // employee (CA, or rateMode "manual") NEVER has their rate auto-adjusted
      // by age, so this is always a nudge to go review/update it by hand --
      // regardless of whether the row got split (it won't, since the rate
      // can't have changed -- see buildRowsForStore). An Award-rate employee
      // only gets a note when the birthday actually crossed into a different
      // rate bracket (row.isBirthdaySplit) -- nothing to flag if it landed in
      // the same bracket either side (e.g. already an adult).
      rows.forEach(r=>{
        if(!r.birthdayInPeriod) return;
        const isFixedRate = r.paymentType==="CA" || r.rateMode==="manual";
        if(isFixedRate){
          bdayNotes.add(`偵測到「${r.baseName}」（${store.name}）在本次計算期間內生日增加一歲 — ⚠️ 固定/手動輸入費率，系統不會自動調整，請確認是否需要更新費率`);
        } else if(r.isBirthdaySplit){
          bdayNotes.add(`偵測到「${r.baseName}」（${store.name}）在本次計算期間內生日增加一歲 — 🎂 已自動依新年齡調整 Award 費率`);
        }
      });
    }
    bdayNotes.forEach(n=>warnings.push(n));
    if(pendingTransfers.length) applyCrossStoreTransfers(pendingTransfers, warnings);
    if(directPools.size) applyDirectPools(directPools, warnings);
    // Jeff, 2026-09-30: same as the loadDraft/loadCompleted picker above --
    // let tab1Html() choose the sorted first tab instead of Object.keys()'
    // insertion order.
    activeOutputStoreId = null;
    renderMain();
    const warnBox = document.getElementById("t1-import-warn");
    if(warnBox && warnings.length){
      warnBox.innerHTML = `<div class="helpbox">${warnings.map(w=>escapeHtml(w)).join("<br>")}</div>`;
    }
  };
  if(allDateIssues.length){
    // Offer to widen the calc sheet's date range to also cover the out-of-range
    // date(s) found in the roster, then commit -- the hours themselves are
    // already bucketed under their correct calendar dates regardless, so no
    // re-parse is needed, just extending the period boundaries (a union with
    // the currently selected range, not a replacement, so a multi-week period
    // isn't accidentally shrunk down to a single file's week).
    const adopt = async ()=>{
      const isos = allDateIssues.map(i=>i.gotIso).filter(Boolean);
      if(!isos.length){ toast("無法從班表判斷正確日期，請手動調整上方日期區間後再匯入。"); return; }
      const allBounds = [workingSheet.dateFrom, workingSheet.dateTo, ...isos].sort();
      closeModal();
      workingSheet.dateFrom = allBounds[0];
      workingSheet.dateTo = allBounds[allBounds.length-1];
      await commit();
      renderMain();
    };
    showDateMismatchModal(allDateIssues, commit, adopt);
  } else {
    await commit();
  }
}

async function saveWorkingSheet(status){
  const ws = workingSheet;
  if(!Object.keys(ws.stores||{}).length){ toast("請先匯入班表資料"); return; }
  const wasAlreadyCompleted = ws.status==="completed";
  if(!ws.id) ws.id = "calc_"+await nextId("calcSheet");
  ws.status = status;
  ws.updatedAt = new Date().toISOString();
  if(status==="completed" && !ws.submittedAt) ws.submittedAt = new Date().toISOString();
  const pendingCharges = ws.pendingCharges || [];
  delete ws.pendingCharges; // transient -- persisted separately into supportLedger below, not stored on the calc sheet itself
  await idbPut("calcSheets", ws);
  for(const c of pendingCharges){
    const rec = {
      id: "ledger_"+await nextId("ledger"), type:"charge",
      calcSheetId: ws.id, dateFrom: ws.dateFrom, dateTo: ws.dateTo,
      employeeName: c.employeeName,
      debtorStoreId: c.debtorStoreId, debtorStoreName: c.debtorStoreName,
      creditorStoreId: c.creditorStoreId, creditorStoreName: c.creditorStoreName,
      hours: c.hours, amount: c.amount,
      createdAt: new Date().toISOString(),
    };
    await idbPut("supportLedger", rec);
  }
  autoBackupIfEnabled();
  toast(status==="completed" ? (wasAlreadyCompleted ? "已儲存變更" : "已提交，移至計算表紀錄") : "已儲存（待提交）");
}

function bdayNoteFor(r){
  if(!r.birthdayInPeriod) return "";
  const isFixedRate = r.paymentType==="CA" || r.rateMode==="manual";
  if(isFixedRate) return "⚠️本期生日+1歲，固定/手動費率未自動調整，請確認費率";
  return r.isBirthdaySplit ? "🎂本期生日+1歲，已自動調整費率" : "";
}
// English equivalent of bdayNoteFor, used only for 會計資料 (accounting) --
// that whole view/export is in English per spec.
function bdayNoteForEn(r){
  if(!r.birthdayInPeriod) return "";
  const isFixedRate = r.paymentType==="CA" || r.rateMode==="manual";
  if(isFixedRate) return "⚠️Birthday +1yr this period - fixed/manual rate not auto-adjusted, please confirm rate";
  return r.isBirthdaySplit ? "🎂Birthday +1yr this period - rate auto-adjusted" : "";
}
// opts.view: "master" (總資料, all employees incl. CA) or "accounting" (會計
//資料, FT/PT/Casual only). Defaults to "master" for callers that don't care.
async function exportSheetToXlsx(sheet, opts){
  const view = (opts && opts.view) || "master";
  const periodDays = dateRangeArray(sheet.dateFrom, sheet.dateTo).length;
  const weekendSplit = currentSettings.weekendSplit;
  const cols = bucketCols(weekendSplit);
  const sheets = Object.values(sheet.stores).map(sd=>{
    sd.rows.forEach(r=>recalcRow(r, periodDays));
    let header, rows, sheetMerges;
    if(view==="accounting"){
      // Column layout: Name(0) Age(1), then a rate+hr pair per bucketCols()
      // entry (Weekday/Weekend/Public holiday, or Weekday/Saturday/Sunday/
      // Public holiday when weekendSplit is on), then Total/Tax/Net/Note.
      const numCols = 2 + cols.length*2 + 4;
      const totalIdx = numCols-4, taxIdx = numCols-3, netIdx = numCols-2, noteIdx = numCols-1;
      // Column index -> which "group" each column belongs to, used below to
      // draw a double border between groups and a bold outer border around
      // the whole table.
      const groupStartCols = new Set([0]);
      cols.forEach((_,i)=> groupStartCols.add(2+i*2));
      groupStartCols.add(totalIdx);
      // Two physical header rows, like the reference layout: row 1 has
      // Name/Age/Total/Tax/Net/Note (each merged vertically across both
      // header rows) plus each group's label (Weekday/Weekend/Public
      // holiday, merged horizontally across its rate+hr columns); row 2
      // has the "rate"/"hr" sub-labels. A merged group label only needs to
      // fit across its 2 columns COMBINED (see `skipWidth` on
      // sheetsToXlsx), so the rate/hr columns end up sized to "rate"/"hr"
      // and the numeric data rather than the long group name -- that's
      // what keeps them narrow without needing to wrap any text, so every
      // header label renders on one line and the row height stays default.
      const headerRow1 = new Array(numCols).fill("");
      const headerRow2 = new Array(numCols).fill("");
      const groupLabelCols = new Set();
      headerRow1[0] = "Name"; headerRow1[1] = "Age";
      cols.forEach(([k,label],i)=>{
        const c = 2+i*2;
        headerRow1[c] = label;
        groupLabelCols.add(c);
        headerRow2[c] = "rate"; headerRow2[c+1] = "hr";
      });
      headerRow1[totalIdx] = "Total"; headerRow1[taxIdx] = "Tax"; headerRow1[netIdx] = "Net"; headerRow1[noteIdx] = "Note";
      const merges = [0,1,totalIdx,taxIdx,netIdx,noteIdx].map(ci=>{
        const col = indexToColLetter(ci);
        return `${col}1:${col}2`;
      });
      cols.forEach((_,i)=>{
        const c = 2+i*2;
        merges.push(`${indexToColLetter(c)}1:${indexToColLetter(c+1)}1`);
      });
      // Every cell gets a full grid: "thin" on ordinary internal edges,
      // "double" between column groups (what the user asked for), and
      // "medium" (a bold single line) around the whole table's outside
      // edge, under the two-row header block, and around the trailing
      // Total row, so the table (and the Total row within it) each read
      // as one boxed unit.
      function borderedRow(values, rIdx, numRows, opts){
        opts = opts || {};
        return values.map((v,cIdx)=>{
          const cell = {
            v,
            border: {
              top: (rIdx===0 || rIdx===numRows-1) ? "medium" : "thin",
              bottom: (rIdx===1 || rIdx===numRows-1) ? "medium" : "thin", // bold under the 2-row header block, and along the table's bottom edge (the Total row)
              left: cIdx===0 ? "medium" : (groupStartCols.has(cIdx) ? "double" : "thin"),
              right: cIdx===numCols-1 ? "medium" : "thin",
            },
          };
          if(opts.bold) cell.bold = true;
          if(opts.center) cell.center = true;
          if(opts.skipWidthCols && opts.skipWidthCols.has(cIdx)) cell.skipWidth = true;
          if(opts.decimals2Cols && opts.decimals2Cols.has(cIdx)) cell.decimals2 = true;
          return cell;
        });
      }
      // Rate columns and Total/Tax/Net always display two decimal places
      // (e.g. "20.00", not "20") -- NOT the hr columns, which are plain
      // hour counts.
      const decimals2Cols = new Set([totalIdx, taxIdx, netIdx]);
      cols.forEach((_,i)=> decimals2Cols.add(2+i*2));
      // CA and Direct are both entirely cash-in-hand with no payroll-facing
      // figures, so both are excluded here (see renderAccountingTable).
      const includedRows = sd.rows.filter(r=>r.paymentType!=="CA" && r.paymentType!=="Direct");
      const dataRows = includedRows.map(r=>{
        const row = [r.name, ageLabelEn(r)];
        cols.forEach(([k])=>{ row.push(round2(r.rates[k]), round2((r.awardHours&&r.awardHours[k])||0)); });
        row.push(round2(r.bankAmount||0), round2(r.tax), round2(r.net), bdayNoteForEn(r));
        return row;
      });
      // A bold summary row at the bottom totalling just the Total/Tax/Net
      // columns (everything else left blank) -- summed from the underlying
      // unrounded figures, then rounded once, rather than summing the
      // already-rounded per-row display values.
      const totalRowValues = new Array(numCols).fill("");
      totalRowValues[0] = "Total";
      totalRowValues[totalIdx] = round2(includedRows.reduce((s,r)=>s+(r.bankAmount||0),0));
      totalRowValues[taxIdx] = round2(includedRows.reduce((s,r)=>s+(r.tax||0),0));
      totalRowValues[netIdx] = round2(includedRows.reduce((s,r)=>s+(r.net||0),0));
      const numRows = 2 + dataRows.length + 1; // 2 header rows + data rows + total row
      rows = [
        borderedRow(headerRow1, 0, numRows, {center:true, skipWidthCols: groupLabelCols}),
        borderedRow(headerRow2, 1, numRows, {center:true}),
      ];
      dataRows.forEach((row,i)=> rows.push(borderedRow(row, i+2, numRows, {decimals2Cols})));
      rows.push(borderedRow(totalRowValues, numRows-1, numRows, {bold:true, decimals2Cols}));
      sheetMerges = merges;
    } else {
      header = ["Name","Total hr","Total amount","Bank amount","Cash amount","Withheld tax"];
      cols.forEach(([k,label])=>{ header.push("補"+label+" hr"); });
      header.push("Bonus","Bonus hr","備註");
      rows = [header];
      sd.rows.forEach(r=>{
        const isDirect = r.paymentType==="Direct";
        const totalHr = isDirect ? (r.directAdjustedTotal||0)
          : ["weekday","saturday","sunday","publicHoliday"].reduce((s,k)=> s+(r.hoursFinal?r.hoursFinal[k]:0), 0);
        const row = [r.name, round2(totalHr), round2(r.total), round2(r.bankAmount||0), round2(r.cashAmount||0), round2(r.tax)];
        cols.forEach(([k])=>{ row.push(round2((r.adj&&r.adj[k])||0)); });
        row.push(round2(r.bonus||0), round2(r.directBonusHr||0), bdayNoteFor(r));
        rows.push(row);
      });
    }
    return {name: (sd.storeName||"Store").slice(0,31), rows, merges: sheetMerges};
  });
  const filenameBase = view==="accounting"
    ? `payroll_${sheet.dateFrom}_${sheet.dateTo}`
    : `薪水計算表_${sheet.dateFrom}_${sheet.dateTo}_總資料`;
  await exportTabularWorkbook(sheets, filenameBase);
}
async function exportTabularWorkbook(sheetsData, filenameBase){
  const inCapabilityMode = typeof window.claude !== "undefined" && window.claude && window.claude.use;
  if(!inCapabilityMode){
    const bytes = sheetsToXlsx(sheetsData);
    downloadBytesDirect(bytes, filenameBase+".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    toast(`已下載：${filenameBase}.xlsx`);
    return;
  }
  // Inside the Artifact viewer, script-driven downloads only work through the
  // `downloads` capability, whose allowlist does not include .xlsx — fall back
  // to CSV, then plain tab-separated .txt (both open fine in Excel).
  const combinedRows = [];
  sheetsData.forEach((s,i)=>{
    if(i>0) combinedRows.push([]);
    combinedRows.push([`==== ${s.name} ====`]);
    s.rows.forEach(r=>combinedRows.push(r));
  });
  let dl = null;
  try{ dl = await window.claude.use("downloads"); }catch(e){ dl=null; }
  if(!dl){ toast("此檢視模式不支援下載，請改用下載的獨立版 App"); return; }
  try{
    const csvBytes = new TextEncoder().encode(rowsToCsv(combinedRows));
    await dl.save({filename: filenameBase+".csv", data: csvBytes});
    toast(`已下載：${filenameBase}.csv`);
  }catch(err){
    if(err && (err.code==="extension_not_enabled" || err.code==="rejected_extension")){
      try{
        const tsvBytes = new TextEncoder().encode(combinedRows.map(r=>r.map(c=>{ c=cellValue(c); return c==null?"":String(c); }).join("\t")).join("\r\n"));
        await dl.save({filename: filenameBase+".txt", data: tsvBytes});
        toast(`已下載：${filenameBase}.txt（Tab 分隔，可用 Excel 開啟）`);
      }catch(err2){
        toast(`下載失敗：${(err2&&err2.message)||"未知錯誤"}`);
      }
    } else if(err && err.code==="declined"){
      // user cancelled the save prompt, nothing further to do
    } else {
      toast(`下載失敗：${(err&&err.message)||"未知錯誤"}`);
    }
  }
}
function round2(n){ return Math.round((n||0)*100)/100; }

/* --- 歷史紀錄 子分頁: 支援款項紀錄 --- */
// Turns the flat supportLedger records into per-store, signed, categorized rows.
// Sign/category convention (per spec): a charge where this store is the debtor
// is negative under "owe"; a charge where it's the creditor is positive under
// "owed". A repayment this store PAID reduces its own debt -- positive, shown
// under "owe". A repayment this store RECEIVED reduces what's owed to it --
// negative, shown under "owed".
function computeLedgerRowsForStore(storeId, allLedger){
  const rows = [];
  for(const rec of allLedger){
    if(rec.type==="charge"){
      if(rec.debtorStoreId===storeId){
        rows.push({date:rec.dateFrom, period:`${rec.dateFrom} ~ ${rec.dateTo}`, counterpartyId:rec.creditorStoreId, counterpartyName:rec.creditorStoreName, category:"owe", label:`${rec.employeeName} 支援款項 (積欠 ${rec.creditorStoreName})`, signedAmount:-rec.amount});
      }
      if(rec.creditorStoreId===storeId){
        rows.push({date:rec.dateFrom, period:`${rec.dateFrom} ~ ${rec.dateTo}`, counterpartyId:rec.debtorStoreId, counterpartyName:rec.debtorStoreName, category:"owed", label:`${rec.employeeName} 支援款項 (${rec.debtorStoreName} 積欠其)`, signedAmount:rec.amount});
      }
    } else if(rec.type==="repayment"){
      if(rec.payerStoreId===storeId){
        rows.push({date:rec.date, period:rec.date, counterpartyId:rec.payeeStoreId, counterpartyName:rec.payeeStoreName, category:"owe", label:`償還 ${rec.payeeStoreName}`, signedAmount:rec.amount});
      }
      if(rec.payeeStoreId===storeId){
        rows.push({date:rec.date, period:rec.date, counterpartyId:rec.payerStoreId, counterpartyName:rec.payerStoreName, category:"owed", label:`${rec.payerStoreName} 償還`, signedAmount:-rec.amount});
      }
    }
  }
  return rows;
}

function renderLedgerCheckboxes(){

function renderLedgerList(){
  const listEl = document.getElementById("ledgerList");
  if(!listEl || !ledgerStoreId) return;
  let rows = computeLedgerRowsForStore(ledgerStoreId, ledgerCache);
  if(ledgerFilter!=="all") rows = rows.filter(r=>r.category===ledgerFilter);
  if(ledgerCounterpartyFilter.size) rows = rows.filter(r=>ledgerCounterpartyFilter.has(r.counterpartyId));
  rows.sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
  const total = rows.reduce((s,r)=>s+r.signedAmount,0);
  const amtHtml = (v)=> `<span style="color:${v<0?'var(--danger)':v>0?'var(--ok)':'inherit'};font-weight:600;">${v<0?'-':''}$${fmtMoney(Math.abs(v))}</span>`;

    <tr class="total-row"><td colspan="3">Total</td><td>${amtHtml(total)}</td></tr>
  </tbody></table></div>`;
}

// Jeff, 2026-09-30: same swap-based manual-order pattern as reorderEmp() --
// find the store's neighbour in currentStores (already sortStores()-sorted),
// swap their `.order` values, persist both, then re-render this table so
// the ↑/↓ buttons' disabled state (top/bottom row) is recomputed too.
async function reorderStore(id, dir, container){
  const idx = currentStores.findIndex(s=>s.id===id);
  const swapWith = currentStores[idx+dir];
  if(!swapWith) return;
  const a = currentStores[idx], b = swapWith;
  const tmp = a.order; a.order=b.order; b.order=tmp;
  await saveStore(a); await saveStore(b);
  renderBranchMgmt(container);
}

async function renderEmpMgmt(container){
  if(!empListStoreId && currentStores.length) empListStoreId = currentStores[0].id;
  const opts = currentStores.map(s=>`<option value="${s.id}" ${s.id===empListStoreId?'selected':''}>${escapeHtml(s.name)}</option>`).join("");
  container.innerHTML = `
  <div class="panel">
    <div class="row between">
      <div class="row"><label class="small muted">分店</label><select id="empstoresel">${opts||'<option>（請先新增分店）</option>'}</select></div>
      <div class="row">
        <button id="syncEmpBtn2" ${!empListStoreId?'disabled':''}>🔄 從 Staff Information 同步</button>
        <button class="primary" id="addEmpBtn2" ${!empListStoreId?'disabled':''}>新增員工</button>
      </div>
    </div>
    <p class="small muted" id="empSyncStatus"></p>
    <div id="emplist"></div>
  </div>`;
  const sel = $("#empstoresel");
  if(sel) sel.onchange = ()=>{ empListStoreId=sel.value; renderEmpMgmt(container); };
  const addBtn = $("#addEmpBtn2");
  if(addBtn) addBtn.onclick = ()=>openEmployeeCreateModal(empListStoreId, ()=>renderEmpMgmt(container));
  const syncBtn = $("#syncEmpBtn2");
  if(syncBtn) syncBtn.onclick = ()=>runEmpSync(true);
  renderEmpList();
  if(empListStoreId) await runEmpSync(false);
}
// 進到「員工資料管理」這個分店時自動跑一次（manual=false，不彈 toast），也可
// 用上面新增的「🔄 從 Staff Information 同步」按鈕手動再跑一次
// （manual=true）。找不到同名真實分店時只顯示提示文字，不會報錯或動任何資料。
async function runEmpSync(manual){
  const statusEl = document.getElementById("empSyncStatus");
  const store = currentStores.find(s=>s.id===empListStoreId);
  if(!store) return;
  const real = findRealStore(store);
  if(!real){
    if(statusEl){
      statusEl.textContent = `⚠️ 找不到跟「${store.name}」名稱完全相符的 Staff Information 分店，不會自動同步員工資料（分店名稱需完全一致，大小寫、前後空白不計）。`;
    }
    return;
  }
  if(statusEl) statusEl.textContent = manual ? "同步中…" : "";
  const result = await syncEmployeesFromStaffInfo(store, real);
  renderEmpList();
  if(statusEl){
    const parts = [];
    if(result.created) parts.push(`新增 ${result.created} 位`);
    if(result.updated) parts.push(`更新 ${result.updated} 位`);
    if(result.resigned) parts.push(`已離職/移除 ${result.resigned} 位`);
    statusEl.textContent = `✅ 已跟 Staff Information 的「${real.name}」同步` + (parts.length ? `（${parts.join("、")}）` : "（無變動）");
  }
  if(manual) toast("已跟 Staff Information 同步完成");
}
function renderEmpList(){
  const box = document.getElementById("emplist");
  if(!box) return;
  const list = currentEmployees.filter(e=>e.storeId===empListStoreId && !e.resignDate).sort((a,b)=>(a.order||0)-(b.order||0));
  box.innerHTML = `<div class="table-wrap"><table><thead><tr><th></th><th>姓名</th><th>Payment type</th><th>Level</th><th></th></tr></thead><tbody>
    ${list.map((e,i)=>`<tr data-id="${e.id}">
      <td><button class="iconbtn" data-up="${e.id}" ${i===0?'disabled':''}>↑</button><button class="iconbtn" data-down="${e.id}" ${i===list.length-1?'disabled':''}>↓</button></td>
      <td>${escapeHtml(e.name)}${e.profileId?' <span class="small muted" title="已與 Staff Information 連結">🔗</span>':''}</td><td>${PAYMENT_TYPE_LABEL[e.paymentType]||e.paymentType}</td>
      <td>${(currentSettings.awardLevels.find(l=>l.id===e.level)||{}).name||''}</td>
      <td><button class="ghost" data-editemp="${e.id}">編輯</button><button class="danger" data-resign="${e.id}">離職</button><button class="danger" data-delemp="${e.id}">刪除</button></td>
    </tr>`).join("") || `<tr><td colspan="5" class="muted">此分店尚無在職員工</td></tr>`}
  </tbody></table></div>`;
  $all("[data-up]",box).forEach(b=>b.onclick=()=>reorderEmp(b.dataset.up,-1,list));
  $all("[data-down]",box).forEach(b=>b.onclick=()=>reorderEmp(b.dataset.down,1,list));
  $all("[data-editemp]",box).forEach(b=>b.onclick=()=>openEmployeeEditModal(b.dataset.editemp));
  $all("[data-resign]",box).forEach(b=>b.onclick=()=>openResignModal(b.dataset.resign));
  $all("[data-delemp]",box).forEach(b=>b.onclick=()=>openDeleteEmpModal(b.dataset.delemp));
}
function openDeleteEmpModal(empId){

async function reorderEmp(id, dir, list){
  const idx = list.findIndex(e=>e.id===id);
  const swapWith = list[idx+dir];
  if(!swapWith) return;
  const a = list[idx], b = swapWith;
  const tmp = a.order; a.order=b.order; b.order=tmp;
  await saveEmployee(a); await saveEmployee(b);
  renderEmpList();
}

  };
  function renderDocs(){

    $all("[data-docupload]",m).forEach(inp=>{

    $all("[data-docdl]",m).forEach(b=>{
      b.onclick = async ()=>{
        const doc = emp.documents[b.dataset.docdl];

    $all("[data-docrm]",m).forEach(b=>{
      b.onclick = ()=>{ delete emp.documents[b.dataset.docrm]; renderDocs(); };

  renderDocs();
  $("#msave",m).onclick = async ()=>{
    emp.name = $("#ename",m).value.trim();
    emp.paymentType = $("#eptype",m).value;
    emp.level = $("#elevel",m).value;
    const homeSel = $("#ehomestore",m);
    if(homeSel && homeSel.value) emp.storeId = homeSel.value;
    // The 5 fields below are read-only (disabled, see the 🔗 markers above)
    // once profileId is set — they're owned by Staff Information and kept
    // in sync by syncEmployeesFromStaffInfo(), not editable from here. The
    // inputs are disabled so their .value can't actually have changed, but
    // this guard keeps that true even if the modal markup ever changes.
    if(!emp.profileId){
      emp.dob = $("#edob",m).value || null;
      emp.tfn = $("#etfn",m).value.trim();
      emp.email = $("#eemail",m).value.trim();
      emp.phone = $("#ephone",m).value.trim();
      emp.hireDate = $("#ehire",m).value;
    }
    emp.taxType = $("#etaxtype",m).value;
    emp.isSchoolStudent = $("#eschoolstudent",m).checked;
    const capVal = $("#ehourcap",m).value;
    emp.hourCap = emp.isSchoolStudent ? null : (capVal===""? null : Number(capVal));
    emp.bankAccountName = $("#ebankname",m).value.trim();
    emp.bankBsb = $("#ebankbsb",m).value.trim();
    emp.bankAccountNumber = $("#ebankacc",m).value.trim();
    if(emp.paymentType==="Direct"){
      emp.directCashRate = Number($("#edirectcashrate",m).value)||0;
      const phMultVal = Number($("#edirectphmult",m).value);
      emp.directPhMultiplier = isFinite(phMultVal) && $("#edirectphmult",m).value!=="" ? phMultVal : 1;
      emp.directExtraHr = Number($("#edirectextrahr",m).value)||0;
      emp.directHourLimit = Number($("#edirecthourlimit",m).value)||0;
    } else if(rateEditing){
      cols.forEach(([k])=>{
        const inp = $(`[data-rate="${k}"]`,m); if(inp) emp.rates[k]=Number(inp.value)||0;
        const cinp = $(`[data-cashrate="${k}"]`,m); if(cinp) emp.cashRates[k]=Number(cinp.value)||0;
      });
      emp.rateMode = "manual";
      if(!weekendSplit){ emp.rates.sunday = emp.rates.saturday; emp.cashRates.sunday = emp.cashRates.saturday; }
    }
    await saveEmployee(emp);
    closeModal();
    renderMain();
  };
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* --- 員工資料主檔匯入 (系統設置) --- */
const EMP_IMPORT_HEADERS = ["分店名稱","姓名","生日(YYYY-MM-DD)","Payment Type(FT/PT/Casual/CA)","Level代碼","TFN","Email","電話","入職日期(YYYY-MM-DD)","Tax type(Y=With tax-free threshold/N=No tax-free threshold/WHM=Working holiday visa)","可報時數上限","Weekday rate","Saturday rate","Sunday rate","Public holiday rate","Weekday cash rate","Saturday cash rate","Sunday cash rate","Public holiday cash rate"];
function cellToIsoDate(v){
  if(v==null || v==="") return null;
  if(typeof v==="number"){ const p=parseDateCell(v); return p? `${p.year}-${pad2(p.month+1)}-${pad2(p.day)}` : null; }
  const s = cellStr(v);
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
  const p = parseDateCell(v);
  return (p && p.year!=null) ? `${p.year}-${pad2(p.month+1)}-${pad2(p.day)}` : null;
}
async function downloadEmployeeImportTemplate(){
  const exLevel = (currentSettings.awardLevels[0]||{}).id||"L1";
  const example = ["Sunnybank","王小明","2000-05-01","FT",exLevel,"","","",toISO(new Date()),"Y",DEFAULT_HOUR_CAP,"","","","","","","",""];
  const sheets = [{name:"員工資料", rows:[EMP_IMPORT_HEADERS, example]}];
  await exportTabularWorkbook(sheets, "員工資料主檔_匯入範本");
}
async function parseEmployeeImportFile(file){
  const buf = await file.arrayBuffer();
  const sheets = await xlsxToSheets(buf);
  const results = []; const warnings = [];
  // Support BOTH conventions: (a) a single sheet listing every employee with an
  // explicit 分店名稱 column per row, and (b) one worksheet/tab per store (same
  // convention already used for roster imports) where 分店名稱 may be left blank
  // and defaults to that sheet's tab name. Every sheet in the workbook is parsed,
  // not just the first -- otherwise stores on tabs 2+ silently import with no rates.
  sheets.forEach(sheet=>{
    const rows = sheet.rows || [];
    for(let i=1;i<rows.length;i++){
      const r = rows[i]||[];
      const rawStoreName = cellStr(r[0]);
      const name = cellStr(r[1]);
      if(!rawStoreName && !name) continue; // blank row, skip silently
      if(!name){ warnings.push(`[${sheet.name}] 第 ${i+1} 列缺少姓名，已略過`); continue; }
      const storeName = rawStoreName || sheet.name;
      const dob = cellToIsoDate(r[2]);
      const rawPaymentType = cellStr(r[3])||"FT";
      const paymentType = PAYMENT_TYPES.find(pt=>pt.toLowerCase()===rawPaymentType.toLowerCase()) || "FT";
      const levelId = cellStr(r[4]);
      const tfn = cellStr(r[5]);
      const email = cellStr(r[6]);
      const phone = cellStr(r[7]);
      const hireDate = cellToIsoDate(r[8]) || toISO(new Date());
      const tftRaw = cellStr(r[9]).toUpperCase();
      const taxType = (tftRaw==="WHM"||tftRaw==="WH"||tftRaw==="WORKING HOLIDAY"||tftRaw==="WORKING HOLIDAY VISA") ? "workingHoliday"
        : (tftRaw==="N"||tftRaw==="NO"||tftRaw==="FALSE") ? "without" : "with";
      const hourCapRaw = cellStr(r[10]);
      const hourCap = hourCapRaw==="" ? null : Number(hourCapRaw);
      const rateVals = [11,12,13,14].map(ci=> r[ci]===undefined||r[ci]===null||r[ci]==="" ? null : Number(r[ci]));
      const cashRateVals = [15,16,17,18].map(ci=> r[ci]===undefined||r[ci]===null||r[ci]==="" ? null : Number(r[ci]));
      // Whether the "Weekday/Saturday/Sunday/Public holiday rate" columns and the
      // "...cash rate" columns were filled in are tracked INDEPENDENTLY -- a row
      // can supply one without the other (e.g. leave the award rate blank so it
      // auto-calculates from Level/age, but still specify a manual cash rate).
      const hasManualRate = rateVals.some(v=>v!=null);
      const hasManualCashRate = cashRateVals.some(v=>v!=null);
      results.push({storeName, name, dob, paymentType, levelId, tfn, email, phone, hireDate, taxType, hourCap, rateVals, cashRateVals, hasManualRate, hasManualCashRate});
    }
  });
  return {results, warnings};
}
async function commitEmployeeImport(results){
  let created=0, updated=0, storesCreated=0;
  const warnings=[];
  for(const r of results){
    let store = currentStores.find(s=>s.name.trim().toLowerCase()===r.storeName.trim().toLowerCase());
    if(!store){
      const id = "store_"+await nextId("store");
      store = {id, name:r.storeName, publicHolidays:[], order: currentStores.length};
      await saveStore(store);
      storesCreated++;
    }
    let level = currentSettings.awardLevels.find(l=>l.id===r.levelId);
    if(!level){
      if(r.levelId) warnings.push(`「${r.name}」指定的 Level 代碼「${r.levelId}」不存在，已改用預設 Level`);
      level = currentSettings.awardLevels[0];
    }
    const paymentType = PAYMENT_TYPES.includes(r.paymentType) ? r.paymentType : "FT";
    const age = r.dob ? calcAge(r.dob, toISO(new Date())) : null;
    const existing = currentEmployees.find(e=>e.storeId===store.id && e.name.trim().toLowerCase()===r.name.trim().toLowerCase());
    let rates, cashRates, rateMode;
    if(paymentType==="CA"){
      // CA is cash-only and never Award-computed -- its single effective rate
      // (the "費率" column shown for CA on the Employee edit screen) comes from
      // whichever of the "Weekday rate" or "Weekday cash rate" columns this row
      // filled in (either is honoured), falling back to the employee's existing
      // rate if the file provides neither.
      if(r.hasManualRate){
        rates = makeRatesObj(r.rateVals[0]||0, r.rateVals[1]||0, r.rateVals[2]||0, r.rateVals[3]||0);
      } else if(r.hasManualCashRate){
        rates = makeRatesObj(r.cashRateVals[0]||0, r.cashRateVals[1]||0, r.cashRateVals[2]||0, r.cashRateVals[3]||0);
      } else if(existing){
        rates = existing.rates;
      } else {
        rates = emptyBuckets();
      }
      cashRates = emptyBuckets();
      rateMode = "manual";
      if(!rates.weekday && !rates.saturday && !rates.sunday && !rates.publicHoliday){
        warnings.push(`「${r.name}」(${store.name}, CA) 匯入檔案未填寫費率，系統內也沒有既有費率可沿用，已預設為 $0 — CA 員工的費率不會依 Level 自動計算，請於員工資料手動設定，或在匯入檔案的 Weekday/Saturday/Sunday/Public holiday rate（或 cash rate）欄位填入費率`);
      }
    } else if(r.hasManualRate){
      rates = makeRatesObj(r.rateVals[0]||0, r.rateVals[1]||0, r.rateVals[2]||0, r.rateVals[3]||0);
      cashRates = r.hasManualCashRate ? makeRatesObj(r.cashRateVals[0]||0, r.cashRateVals[1]||0, r.cashRateVals[2]||0, r.cashRateVals[3]||0) : {...rates};
      rateMode = "manual";
    } else {
      const computed = computeAwardRates(currentSettings, level.id, paymentType, age);
      rates = makeRatesObj(computed.weekday, computed.saturday, computed.sunday, computed.publicHoliday);
      cashRates = r.hasManualCashRate ? makeRatesObj(r.cashRateVals[0]||0, r.cashRateVals[1]||0, r.cashRateVals[2]||0, r.cashRateVals[3]||0) : {...rates};
      rateMode = "award";
    }
    const emp = existing ? {...existing} : {
      id: "emp_"+await nextId("employee"),
      storeId: store.id,
      profileId: null,
      documents: {},
      order: currentEmployees.filter(e=>e.storeId===store.id).length,
      resignDate: null,
    };
    emp.name = r.name;
    // Same rule as the Edit modal: once profileId is set (this employee was
    // synced in from Staff Information — see syncEmployeesFromStaffInfo),
    // dob/TFN/email/phone/hireDate are owned by Staff Information, so a
    // bulk import shouldn't be able to clobber them either.
    if(!emp.profileId){
      emp.dob = r.dob;
      emp.tfn = r.tfn;
      emp.email = r.email;
      emp.phone = r.phone;
      emp.hireDate = r.hireDate;
    } else if(r.dob!==emp.dob || r.tfn!==emp.tfn || r.email!==emp.email || r.phone!==emp.phone || r.hireDate!==emp.hireDate){
      warnings.push(`「${r.name}」(${store.name}) 已與 Staff Information 連結，匯入檔案裡的生日/TFN/Email/電話/入職日期已略過不匯入（這些欄位由 Staff Information 維護，見「員工資料管理」頁的 🔗 標示）`);
    }
    emp.paymentType = paymentType;
    emp.level = level.id;
    emp.taxType = r.taxType;
    emp.hourCap = r.hourCap;
    emp.rates = rates;
    emp.cashRates = cashRates;
    emp.rateMode = rateMode;
    await saveEmployee(emp);
    if(existing) updated++; else created++;
  }
  return {created, updated, storesCreated, warnings};
}

function renderHistTable(){
  const box = document.getElementById("histtable");
  if(!box) return;
  let list = currentEmployees.filter(e=>e.storeId===histStoreId);
  const {col,dir} = histSort;
  list = list.slice().sort((a,b)=>{
    const av = a[col]||"9999-99-99", bv = b[col]||"9999-99-99";
    return dir==="asc" ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
  });
  const arrow = (c)=> histSort.col===c ? (histSort.dir==="asc"?" ▲":" ▼") : "";
  box.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>姓名</th><th class="link" data-sort="hireDate">入職日期${arrow('hireDate')}</th><th class="link" data-sort="resignDate">離職日期${arrow('resignDate')}</th>
  </tr></thead><tbody>
    ${list.map(e=>`<tr><td>${escapeHtml(e.name)}</td><td>${e.hireDate||''}</td><td>${e.resignDate||''}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">尚無資料</td></tr>`}
  </tbody></table></div>`;
  $all("[data-sort]",box).forEach(th=>{
    th.onclick = ()=>{
      const c = th.dataset.sort;
      histSort = { col:c, dir: (histSort.col===c && histSort.dir==="asc") ? "desc":"asc" };
      renderHistTable();
    };
  });
}

function taxTableHtml(kind, label){

  <div class="table-wrap"><table id="taxtable-${kind}"><thead><tr><th>年收入下限</th><th>年收入上限（留空=無上限）</th><th>基本稅額</th><th>邊際稅率 (%)</th></tr></thead>
  <tbody>${rows.map(r=>`<tr>
    <td class="editcell"><input data-tx="min" type="number" value="${r.min}"></td>
    <td class="editcell"><input data-tx="max" type="number" value="${r.max===Infinity?'':r.max}"></td>
    <td class="editcell"><input data-tx="base" type="number" value="${r.base}"></td>
    <td class="editcell"><input data-tx="rate" type="number" step="0.1" value="${(r.rate*100).toFixed(1)}"></td>
  </tr>`).join("")}</tbody></table></div>`;
}
/* -------------------------------------------------------------------------
   Backup folder (File System Access API) -- lets manual and automatic
   backups write DIRECTLY into a folder the user chooses once (e.g. a
   cloud-synced folder), instead of going through the browser's normal
   download flow every single time. Chrome/Edge only (Chromium); Safari and
   Firefox don't implement this API, so everything here degrades to the
   pre-existing download-based behaviour on those browsers automatically.
   The chosen FileSystemDirectoryHandle is stored in IndexedDB (the "meta"
   store already used for other app-level state) -- it's structured-clone-
   able, so it survives page reloads, but the browser still requires
   permission to be (re)confirmed at least once per fresh page load.
   ------------------------------------------------------------------------- */
function fsAccessSupported(){
  return typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";
}
async function getSavedBackupDirHandle(){
  if(!fsAccessSupported()) return null;
  try{
    const rec = await idbGet("meta","backupDirHandle");
    return rec && rec.handle ? rec.handle : null;
  }catch(e){ return null; }
}
async function chooseBackupDir(){
  if(!fsAccessSupported()){ toast("此瀏覽器不支援資料夾存取功能，請改用 Chrome 或 Edge。"); return; }
  try{
    const handle = await window.showDirectoryPicker({mode:"readwrite"});
    await idbPut("meta", {key:"backupDirHandle", handle});
    toast(`已選擇備份資料夾：${handle.name}`);
  }catch(e){
    if(e && e.name==="AbortError") return; // user closed the picker without choosing
    toast("選擇資料夾失敗："+((e&&e.message)||"未知錯誤"));
  }
}
async function clearBackupDir(){
  await idbDelete("meta","backupDirHandle");
  toast("已取消備份資料夾設定，之後備份將改用瀏覽器下載");
}
// "granted" | "denied" | "prompt" | null (null = no folder chosen, or this
// browser doesn't support the API at all). `forPrompt` should only be true
// when this call is itself running inside a user gesture (e.g. a button
// click) -- requestPermission() is required (and only allowed) there; a
// silent background call (auto-backup after an edit) must NOT pass true, or
// the browser will simply throw/ignore it since there's no active gesture.
async function backupDirPermission(handle, forPrompt){
  if(!handle) return null;
  try{
    let perm = await handle.queryPermission({mode:"readwrite"});
    if(perm!=="granted" && forPrompt) perm = await handle.requestPermission({mode:"readwrite"});
    return perm;
  }catch(e){ return "denied"; }
}
// Writes `bytes` as `filename` straight into the chosen backup folder.
// Returns true on success; false if no folder is chosen, this browser
// doesn't support it, or permission isn't (and, per forPrompt, couldn't be)
// granted -- callers fall back to a normal browser download in that case.
async function writeToBackupDir(bytes, filename, forPrompt){
  const handle = await getSavedBackupDirHandle();
  if(!handle) return false;
  const perm = await backupDirPermission(handle, forPrompt);
  if(perm!=="granted") return false;
  try{
    const fileHandle = await handle.getFileHandle(filename, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(bytes);
    await writable.close();
    return true;
  }catch(e){ return false; }
}
// Renders the "備份資料夾" status line + action button(s) inside the
// settings panel and keeps them in sync with the actual permission state.
// Split out from renderSysSettings (which stays synchronous, like every
// other render* function) because checking a directory handle's permission
// is inherently async.
async function refreshBackupDirStatus(container){
  const statusEl = container.querySelector("#backupDirStatus");
  const btnsEl = container.querySelector("#backupDirButtons");
  if(!statusEl || !btnsEl) return; // settings page navigated away before this resolved
  if(!fsAccessSupported()){
    statusEl.textContent = "此瀏覽器不支援資料夾存取功能（需要 Chrome 或 Edge），備份將維持瀏覽器下載方式。";
    btnsEl.innerHTML = "";
    return;
  }
  const handle = await getSavedBackupDirHandle();
  if(!handle){
    statusEl.textContent = "尚未設定備份資料夾，備份將透過瀏覽器下載。";
    btnsEl.innerHTML = `<button id="chooseBackupDirBtn">選擇備份資料夾</button>`;
    container.querySelector("#chooseBackupDirBtn").onclick = async ()=>{ await chooseBackupDir(); refreshBackupDirStatus(container); };
    return;
  }
  const perm = await backupDirPermission(handle, false); // silent check only, no prompt yet
  if(perm==="granted"){
    statusEl.textContent = `目前備份資料夾：${handle.name}（已授權）`;
    btnsEl.innerHTML = `<button id="chooseBackupDirBtn">變更資料夾</button><button id="clearBackupDirBtn">清除設定</button>`;
  } else {
    statusEl.textContent = `目前備份資料夾：${handle.name}（權限尚未確認，請點選下方按鈕重新授權）`;
    btnsEl.innerHTML = `<button class="primary" id="reauthBackupDirBtn">重新授權此資料夾</button><button id="chooseBackupDirBtn">變更資料夾</button><button id="clearBackupDirBtn">清除設定</button>`;
    const reauth = container.querySelector("#reauthBackupDirBtn");
    if(reauth) reauth.onclick = async ()=>{ await backupDirPermission(handle, true); refreshBackupDirStatus(container); };
  }
  container.querySelector("#chooseBackupDirBtn").onclick = async ()=>{ await chooseBackupDir(); refreshBackupDirStatus(container); };
  const clearBtn = container.querySelector("#clearBackupDirBtn");
  if(clearBtn) clearBtn.onclick = async ()=>{ await clearBackupDir(); refreshBackupDirStatus(container); };
}
async function doExportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    stores: await idbAll("stores"),
    employees: await idbAll("employees"),
    calcSheets: await idbAll("calcSheets"),
    supportLedger: await idbAll("supportLedger"),
    settings: await idbGet("settings","app"),
    meta: await idbGet("meta","counters"),
  };
  const bytes = new TextEncoder().encode(JSON.stringify(data,null,2));
  const filename = `payroll_backup_${toISO(new Date())}.json`;
  // This runs from a button click, so it's a valid user gesture -- if a
  // backup folder is chosen but permission needs (re)confirming, this CAN
  // prompt for it right here.
  const wrote = await writeToBackupDir(bytes, filename, true);
  if(wrote){ toast(`已備份到指定資料夾：${filename}`); return; }
  await offerDownload(bytes, filename, "application/json");
}
async function autoBackupIfEnabled(){
  if(!(currentSettings && currentSettings.autoBackup)) return;
  // Inside the Artifact viewer, every save() prompts the viewer for confirmation —
  // firing that on every single edit would be unusable, so silent auto-backup is
  // only actually performed in the standalone (non-capability) build of this app.
  if(typeof window.claude !== "undefined" && window.claude && window.claude.use) return;
  try{ await doExportBackupSilent(); }catch(e){ /* ignore */ }
}
async function doExportBackupSilent(){
  const data = {
    exportedAt: new Date().toISOString(),
    stores: await idbAll("stores"), employees: await idbAll("employees"),
    calcSheets: await idbAll("calcSheets"), supportLedger: await idbAll("supportLedger"),
    settings: await idbGet("settings","app"), meta: await idbGet("meta","counters"),
  };
  const bytes = new TextEncoder().encode(JSON.stringify(data,null,2));
  // Auto-backup can fire on every single edit, so this overwrites ONE rolling
  // file in the backup folder rather than a fresh timestamped file each time
  // (that's what the manual "匯出完整備份檔" button does instead). forPrompt
  // is false: this isn't running inside a user gesture, so it can only use an
  // ALREADY-granted permission -- it must never pop a permission prompt out
  // of nowhere while the user is just editing data.
  const wrote = await writeToBackupDir(bytes, "payroll_backup_auto.json", false);
  if(wrote) return;
  downloadBytesDirect(bytes, `payroll_backup.json`, "application/json");
}

   PART 10: init

  try{
    await loadAllData();
    renderApp();

    document.getElementById("main").innerHTML = `<div class="panel"><h2>初始化失敗</h2><pre>${escapeHtml(err.message+"\\n"+(err.stack||""))}</pre></div>`;
  }
})();
</script>
