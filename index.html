<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Without this, some Android phones' "auto dark theme for web content"
         setting (Chrome's forced/simplified dark mode) rewrites this light
         page into a black background with light text on its own — the app
         never asked for dark mode, the browser imposed one heuristically.
         This explicitly opts the whole page out of that, so it always shows
         the real white/orange theme regardless of the phone's dark mode. -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OT Portal" />
    <title>Orange Tea AU — Staff Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
